<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级随机点名系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 95%;
            max-width: 900px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            margin-bottom: 25px;
            position: relative;
        }
        
        h1 {
            font-size: 36px;
            color: #2575fc;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: titleGlow 3s infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); }
            100% { text-shadow: 0 0 15px rgba(37, 117, 252, 0.7); }
        }
        
        .class-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .class-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-width: 120px;
        }
        
        .class-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .class-btn.active {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }
        
        .result-container {
            position: relative;
            margin: 30px 0;
            perspective: 1000px;
        }
        
        .result {
            font-size: 52px;
            font-weight: bold;
            color: #2575fc;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 25px;
            border-radius: 15px;
            background: #f8f9fa;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
            transform-style: preserve-3d;
        }
        
        .result.rolling {
            animation: roll 0.2s infinite, colorChange 2s infinite alternate;
        }
        
        .student-id {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #6a11cb;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        
        .class-name {
            position: absolute;
            bottom: -15px;
            right: 20px;
            background: #ff7e5f;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes roll {
            0% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-8px) rotateX(10deg); }
            100% { transform: translateY(0) rotateX(0); }
        }
        
        @keyframes colorChange {
            0% { color: #2575fc; }
            50% { color: #6a11cb; }
            100% { color: #ff7e5f; }
        }
        
        .info-panel {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            min-width: 180px;
            transition: transform 0.3s ease;
        }
        
        .info-box:hover {
            transform: translateY(-5px);
        }
        
        .info-box h3 {
            color: #666;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .info-box p {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            min-width: 160px;
            position: relative;
            overflow: hidden;
        }
        
        button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        button:hover:before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(2px);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        button:disabled:before {
            display: none;
        }
        
        .history {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed #ddd;
        }
        
        .history h2 {
            font-size: 24px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .history-list {
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .history-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }
        
        .history-item:hover {
            background: #f0f0f0;
        }
        
        .history-id {
            color: #6a11cb;
            font-weight: bold;
            margin-right: 15px;
            min-width: 50px;
        }
        
        .history-class {
            color: #ff7e5f;
            font-size: 14px;
            margin-left: 15px;
            background: #fff4f0;
            padding: 3px 10px;
            border-radius: 15px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }
            
            .result {
                font-size: 36px;
                min-height: 80px;
            }
            
            button {
                padding: 12px 25px;
                font-size: 16px;
                min-width: 140px;
            }
            
            .info-box {
                min-width: 140px;
                padding: 15px;
            }
            
            .info-box p {
                font-size: 20px;
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: confetti-fall 5s linear forwards;
            z-index: 100;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(1000px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

                    {id: 54, name: "许婷"},
                    {id: 55, name: "魏宸熙"},
                    {id: 56, name: "郑梦琪"},
                    {id: 57, name: "吴沁瑶"},
                    {id: 58, name: "吕景行"},
                    {id: 59, name: "董思远"},
                    {id: 60, name: "蔡书宁"},
                    {id: 61, name: "唐书瑶"}
                ]
            }
        };

        // 初始化变量
        let currentClass = 'class31';
        let intervalId = null;
        let selectedStudents = [];
        let availableStudents = [...classes[currentClass].students];
        const resultElement = document.getElementById('result');
        const studentIdElement = document.getElementById('studentId');
        const classNameElement = document.getElementById('className');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const historyList = document.getElementById('historyList');
        const countElement = document.getElementById('count');
        const selectedCountElement = document.getElementById('selectedCount');
        const remainingCountElement = document.getElementById('remainingCount');
        const classButtons = document.querySelectorAll('.class-btn');
        
        // 音效
        const startSound = document.getElementById('startSound');
        const stopSound = document.getElementById('stopSound');
        const resetSound = document.getElementById('resetSound');
        const confettiSound = document.getElementById('confettiSound');

        // 选择班级
        function selectClass(classKey) {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            
            currentClass = classKey;
            availableStudents = [...classes[classKey].students];
            selectedStudents = [];
            
            resultElement.classList.remove('rolling');
            resultElement.textContent = "点击开始按钮";
            studentIdElement.textContent = "学号";
            classNameElement.textContent = classes[classKey].name;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            updateCounts();
            updateHistory();
            
            // 更新按钮激活状态
            classButtons.forEach(btn => {
                if (btn.dataset.class === classKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 播放选择音效
            resetSound.play();
        }

        // 更新计数显示
        function updateCounts() {
            if (!currentClass) {
                countElement.textContent = "0";
                selectedCountElement.textContent = "0";
                remainingCountElement.textContent = "0";
                return;
            }
            
            countElement.textContent = classes[currentClass].students.length;
            selectedCountElement.textContent = selectedStudents.length;
            remainingCountElement.textContent = classes[currentClass].students.length - selectedStudents.length;
        }

        // 开始点名
        function startRolling() {
            if (intervalId || !currentClass || availableStudents.length === 0) return;
            
            resultElement.classList.add('rolling');
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            // 播放开始音效
            startSound.play();
            
            intervalId = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * availableStudents.length);
                const student = availableStudents[randomIndex];
                resultElement.textContent = student.name;
                studentIdElement.textContent = `学号: ${student.id}`;
            }, 100);
        }

        // 停止点名
        function stopRolling() {
            if (!intervalId || !currentClass) return;
            
            clearInterval(intervalId);
            intervalId = null;
            
            resultElement.classList.remove('rolling');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            // 播放停止音效
            stopSound.play();
            
            // 获取当前显示的学生
            const currentStudentName = resultElement.textContent;
            const currentStudent = classes[currentClass].students.find(s => s.name === currentStudentName);
            
            if (currentStudent) {
                // 从可用学生中移除
                availableStudents = availableStudents.filter(s => s.id !== currentStudent.id);
                
                // 添加到历史记录
                addToHistory(currentStudent);
                
                // 更新计数
                updateCounts();
                
                // 播放庆祝音效和动画
                if (availableStudents.length === 0) {
                    setTimeout(() => {
                        confettiSound.play();
                        createConfetti();
                        alert(`所有学生都已点到！点击重置可以重新开始。`);
                    }, 500);
                }
            }
        }

        // 添加到历史记录
        function addToHistory(student) {
            selectedStudents.unshift({...student, class: currentClass});
            
            // 更新历史记录显示
            updateHistory();
        }

        // 更新历史记录显示
        function updateHistory() {
            historyList.innerHTML = '';
            selectedStudents.forEach((s, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span class="history-id">${s.id}</span> 
                    <span>${s.name}</span>
                    <span class="history-class">${classes[s.class].name}</span>
                `;
                historyList.appendChild(item);
            });
        }

        // 重置点名记录
        function resetHistory() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            
            resultElement.classList.remove('rolling');
            resultElement.textContent = "点击开始按钮";
            studentIdElement.textContent = "学号";
            
            if (currentClass) {
                availableStudents = [...classes[currentClass].students];
                selectedStudents = [];
                updateHistory();
                
                startBtn.disabled = false;
                stopBtn.disabled = true;
                
                updateCounts();
                
                // 播放重置音效
                resetSound.play();
            }
        }

        // 创建庆祝彩花效果
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                confetti.style.opacity = Math.random() * 0.5 + 0.5;
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                container.appendChild(confetti);
                
                // 移除彩花元素
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // 添加事件监听器
        startBtn.addEventListener('click', startRolling);
        stopBtn.addEventListener('click', stopRolling);
        resetBtn.addEventListener('click', resetHistory);

        // 班级选择按钮事件
        classButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectClass(btn.dataset.class);
            });
        });

        // 支持键盘操作
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (intervalId) {
                    stopRolling();
                } else if (currentClass && availableStudents.length > 0) {
                    startRolling();
                }
            }
        });

        // 初始化
        updateCounts();
    </script>

<div id="kaiming-copyright">
  <div class="inner">© 2026 开物AI科学 ｜ AI 赋能 · 教育公平</div>
</div>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("mainTitle") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
