<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧课堂-专注森林</title>
    <style>
        /* 1. 全局和基础样式 - 卡通风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #a8e6cf 0%, #3bb78f 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 2. 容器和布局 (使用 Grid 实现左右分栏) */
        .container {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            width: 95%;
            max-width: 1200px;
            
            display: grid;
            grid-template-columns: 320px 1fr; 
            grid-template-rows: auto 1fr;
            grid-template-areas: 
                "header header"
                "sidebar main";
            gap: 25px;
            height: 90vh; 
        }

        .header {
            grid-area: header;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px dashed #4caf50;
        }

        h1 {
            color: #2e7d32;
            font-size: 2.2rem;
            text-shadow: 1px 1px #c8e6c9;
        }

        /* 左侧：声音检测模块 (sidebar) */
        .sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 右侧：森林种植模块 (main) */
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #e8f5e9;
            border-radius: 15px;
            padding: 20px;
            border: 3px dashed #4caf50;
        }

        /* 优化：左侧控制台面板的统一 UI 风格 */
        .control-panel {
            background-color: #f0f8ff; /* 浅蓝色背景 */
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #b3e5fc; /* 浅蓝色边框 */
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }
        
        /* 状态显示和按钮 */
        #status-box {
            padding: 15px 10px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.5s ease;
            text-align: center;
            flex-shrink: 0;
        }

        .quiet {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .loud {
            background-color: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }

        #start-btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px #388e3c;
            width: 100%;
        }

        #start-btn:active {
            box-shadow: 0 1px #388e3c;
            transform: translateY(3px);
        }
        
        /* 重置按钮 */
        #reset-btn {
            background-color: #ffcc80; /* 浅橙色 */
            color: #333;
            box-shadow: 0 4px #ffb74d;
        }

        #reset-btn:active {
            box-shadow: 0 1px #ffb74d;
            transform: translateY(3px);
        }

        /* 音量条和配置 */
        .meter-container {
            width: 100%;
            height: 20px;
            background-color: #e3f2fd;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #90caf9;
        }

        #volume-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
            transition: width 0.1s linear; 
        }
        
        .config-group {
            border-top: 1px dashed #b3e5fc;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .config label {
            font-size: 0.95rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .config input[type="number"], .config select {
            width: 100%;
            max-width: 80px;
            padding: 5px;
            border: 2px solid #b3e5fc;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 4. 树木生长进度 */
        #progress-container {
            flex-shrink: 0; 
        }
        
        #progress-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4caf50;
            margin-bottom: 5px;
        }

        #progress-meter {
            height: 25px;
            background-color: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background-color: #8bc34a;
            border-radius: 12px;
            transition: width 0.5s ease-out; /* 降低过渡时间，让变化更平滑 */
        }

        /* 5. 森林显示区域 */
        #forest {
            flex-grow: 1; 
            border: 2px dashed #a5d6a7;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            gap: 15px;
            
            overflow-y: auto; 
            min-height: 200px; 
        }

        .tree {
            font-size: 3rem;
            animation: grow 0.5s ease-out;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .tree:hover {
            transform: scale(1.1);
        }
        
        .tree-count {
            flex-shrink: 0;
            font-size: 1.2rem;
            color: #388e3c;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            text-align: center;
        }

        /* 种植动画 */
        @keyframes grow {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 媒体查询：适配小屏幕（如平板竖屏） */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                grid-template-areas: 
                    "header"
                    "sidebar"
                    "main";
                height: auto; 
                max-height: none;
            }
            #forest {
                max-height: 40vh; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="mainTitle">🌳 智慧课堂-专注森林 🌳</h1>
            <p style="color:#666; margin-top:5px;">保持专注，创造属于我们的绿色奇迹！</p>
        </div>

        <div class="sidebar">
            <div id="status-box" class="quiet">
                等待开始检测...
            </div>

            <button id="start-btn">开始专注检测</button>

            <div class="control-panel">
                <div class="config">
                    <label>实时音量指示器 (0-100)</label>
                    <div class="meter-container">
                        <div id="volume-bar"></div>
                    </div>
                </div>

                <div class="config-group">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <label for="quietThreshold">专注音量阈值:</label>
                            <input type="number" id="quietThreshold" value="30" min="10" max="90">
                            <p style="font-size:0.8rem; color:#4caf50;">低于此值，树木生长</p>
                        </div>
                        <div>
                            <label for="loudThreshold">太吵音量阈值:</label>
                            <input type="number" id="loudThreshold" value="70" min="20" max="100">
                            <p style="font-size:0.8rem; color:#c62828;">高于此值，进度倒退</p>
                        </div>
                    </div>
                    
                    <div class="config">
                        <label for="plantingTime">种植一棵树所需时间:</label>
                        <select id="plantingTime">
                            <option value="30">30 秒 (快)</option>
                            <option value="60" selected>1 分钟 (标准)</option>
                            <option value="120">2 分钟 (慢)</option>
                        </select>
                    </div>

                    <div class="config">
                        <label for="sensitivitySlider">麦克风灵敏度:</label>
                        <input type="range" id="sensitivitySlider" min="1" max="5" value="3" style="width:100%;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color:#666;">
                            <span>低 (难变红)</span>
                            <span>高 (易变红)</span>
                        </div>
                    </div>
                </div>

                <button id="reset-btn" class="reset-btn" onclick="resetMonitoring()">重置森林</button>
            </div>
        </div>

        <div class="main-content">
            <h2>我的专注森林</h2>
            
            <div id="progress-container">
                <div id="progress-text">0% - 正在等待开始...</div>
                <div id="progress-meter">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <div id="forest">
                <p style="color:#666; font-style: italic;">请保持安静，第一棵树将在这里等待您的专注力！</p>
            </div>
            
            <div class="tree-count">
                已成功种植树木数量：<span id="tree-count-display">0</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const statusBox = document.getElementById('status-box');
            const volumeBar = document.getElementById('volume-bar');
            const quietThresholdInput = document.getElementById('quietThreshold');
            const loudThresholdInput = document.getElementById('loudThreshold');
            const progressText = document.getElementById('progress-text');
            const progressFill = document.getElementById('progress-fill');
            const forest = document.getElementById('forest');
            const treeCountDisplay = document.getElementById('tree-count-display');
            const sensitivitySlider = document.getElementById('sensitivitySlider');
            const plantingTimeSelect = document.getElementById('plantingTime'); 

            // 常量
            const TARGET_FPS = 60; // 假设每秒刷新 60 次
            
            let audioContext = null;
            let analyser = null;
            let microphone = null;
            let dataArray;
            let isMonitoring = false;
            let animationId;
            
            let treeProgress = 0; // 0 to 100
            let treeCount = 0;

            const treeEmojis = ['🌳', '🌲', '🌴', '🎄', '🌿', '🍄', '🌸'];
            
            function plantTree() {
                treeCount++;
                treeCountDisplay.textContent = treeCount;
                
                if (treeCount === 1) {
                    forest.innerHTML = '';
                }

                const tree = document.createElement('span');
                tree.className = 'tree';
                const randomEmoji = treeEmojis[Math.floor(Math.random() * treeEmojis.length)];
                tree.textContent = randomEmoji;
                
                forest.prepend(tree); 
                forest.scrollTop = 0;
            }

            function updateProgress(progress) {
                progressFill.style.width = `${progress}%`;
                progressText.textContent = `${Math.round(progress)}% - ${progress >= 100 ? '种植成功！' : '正在努力生长...'}`;
            }

            // 核心修正：确保生长速度与选择的时间精确匹配
            function analyzeAudio() {
                if (!isMonitoring || !analyser) return;

                const quietThreshold = parseInt(quietThresholdInput.value);
                const loudThreshold = parseInt(loudThresholdInput.value);
                
                const selectedTime = parseInt(plantingTimeSelect.value);
                
                // 修正后的计算： (100% / 所需时间(秒)) / 60帧/秒 = 每帧的增长量
                const progressIncrementPerFrame = (100 / selectedTime) / TARGET_FPS; 

                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i] * dataArray[i];
                }
                const rms = Math.sqrt(sum / dataArray.length);
                
                const sensitivity = parseInt(sensitivitySlider.value);
                let sensitivityFactor;
                
                switch(sensitivity) {
                    case 1: sensitivityFactor = 0.3; break; 
                    case 2: sensitivityFactor = 0.5; break;
                    case 3: sensitivityFactor = 0.8; break; 
                    case 4: sensitivityFactor = 1.2; break;
                    case 5: sensitivityFactor = 1.8; break; 
                    default: sensitivityFactor = 0.8;
                }
                
                let volumeLevel = Math.min(100, Math.max(0, Math.log(rms + 1) * 10 * sensitivityFactor)); 
                
                volumeBar.style.width = `${volumeLevel}%`;

                // 2. 更新状态和树木生长逻辑
                if (volumeLevel < quietThreshold) {
                    // 安静：树木生长
                    statusBox.className = 'quiet';
                    statusBox.textContent = '🌿 安静专注！树木正在生长...';
                    
                    treeProgress += progressIncrementPerFrame; // 使用修正后的每帧增长量
                } else if (volumeLevel < loudThreshold) {
                    // 警告：生长停止
                    statusBox.className = 'loud';
                    statusBox.textContent = '⚠️ 声音略大，生长暂停...';
                    
                    treeProgress = Math.min(100, Math.max(0, treeProgress)); 
                } else {
                    // 吵闹：进度倒退
                    statusBox.className = 'loud';
                    statusBox.textContent = '🚨 太吵了！进度倒退 -0.5%！';
                    
                    treeProgress = Math.max(0, treeProgress - 0.5); 
                }

                if (treeProgress >= 100) {
                    plantTree();
                    treeProgress = 0; 
                }
                
                updateProgress(treeProgress);
                
                animationId = requestAnimationFrame(analyzeAudio);
            }

            async function startMonitoring() {
                if (isMonitoring) return;
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    microphone.connect(analyser);
                    analyser.fftSize = 256;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    
                    isMonitoring = true;
                    startBtn.textContent = '检测进行中...';
                    startBtn.disabled = true;
                    statusBox.textContent = '检测已启动！请保持安静。';
                    
                    analyzeAudio(); 
                } catch (err) {
                    console.error('麦克风访问失败:', err);
                    statusBox.className = 'loud';
                    statusBox.textContent = '🚨 麦克风访问失败，请允许权限并刷新。';
                    startBtn.disabled = false;
                    startBtn.textContent = '重新尝试';
                }
            }

            window.resetMonitoring = function() {
                isMonitoring = false;
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }

                if (audioContext) {
                    if (microphone && microphone.mediaStream && microphone.mediaStream.getTracks) {
                        microphone.mediaStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext.state !== 'closed') {
                        audioContext.close().catch(e => console.error("Error closing AudioContext:", e));
                    }
                    audioContext = null;
                }
                
                treeProgress = 0;
                treeCount = 0;
                treeCountDisplay.textContent = '0';
                forest.innerHTML = '<p style="color:#666; font-style: italic;">请保持安静，第一棵树将在这里等待您的专注力！</p>';
                
                updateProgress(treeProgress);
                
                startBtn.textContent = '开始专注检测';
                startBtn.disabled = false;
                statusBox.className = 'quiet';
                statusBox.textContent = '等待开始检测...';
                volumeBar.style.width = '0%';
            }
            
            startBtn.addEventListener('click', startMonitoring);

            function validateThresholds() {
                let quiet = parseInt(quietThresholdInput.value);
                let loud = parseInt(loudThresholdInput.value);
                
                if (isNaN(quiet) || quiet < 10) quiet = 10;
                if (isNaN(loud) || loud > 100) loud = 70;

                if (quiet >= loud - 10) {
                    quietThresholdInput.value = Math.max(10, loud - 10);
                }
                if (loud <= quiet + 10) {
                    loudThresholdInput.value = Math.min(100, quiet + 10);
                }
            }

            quietThresholdInput.addEventListener('input', validateThresholds);
            loudThresholdInput.addEventListener('input', validateThresholds);

            updateProgress(treeProgress);
        });
    </script>


<!-- ================= 开物AI科学 · 版权模块（单击显示 / 双击打开官网） ================= -->
<style id="kaiming-copyright-style">
  #kaiming-copyright {
    position: fixed;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 999999;
    transition: opacity 0.45s ease;
    opacity: 0;
    display: none;
  }
  #kaiming-copyright .inner {
    display: inline-block;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #eafaf2;
    padding: 9px 26px;
    border-radius: 60px;
    /* 原稿为 14px；此处改为 16px 以符合本机 verify_html.py 的「字号不得小于 16px」硬规则 */
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.6px;
    border: 1px solid rgba(255, 245, 210, 0.3);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    white-space: nowrap;
  }
</style>

<div id="kaiming-copyright">
  <div class="inner">© 2026 开物AI科学 ｜ AI 赋能 · 教育公平</div>
</div>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("mainTitle") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
<!-- ================= 开物AI科学 · 版权模块 结束 ================= -->

</body>
</html>
