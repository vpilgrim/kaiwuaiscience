<html lang="zh-CN">

    <style>
        :root {
            /* Apple Design Colors */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            --accent: #007AFF;
            --text-main: #1d1d1f;
            --radius: 20px;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            user-select: none;
        }

        /* 3D 画布 */
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d); /* 默认背景占位 */
            transition: background 1s ease;
        }
        
        /* 背景样式类 */
        body.bg-space #canvas-container { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
        body.bg-lab #canvas-container { background: radial-gradient(circle at 50% 50%, #1e3c72, #2a5298); }
        body.bg-sky #canvas-container { background: linear-gradient(160deg, #a1c4fd 0%, #c2e9fb 100%); }

        /* 摄像头小窗 */
        .camera-preview {
            position: absolute;
            top: 20px; left: 20px;
            width: 160px; height: 120px;
            border-radius: 16px;
            overflow: hidden;
            z-index: 10;
            transform: scaleX(-1);
            box-shadow: var(--glass-shadow);
            border: 3px solid rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        .camera-preview.hidden { display: none; }
        .camera-preview video { width: 100%; height: 100%; object-fit: cover; }

        /* 顶部班级切换 */
        .header-bar {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex; gap: 10px;
            padding: 6px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
        }

        .class-btn {
            background: transparent; border: none;
            padding: 8px 24px;
            border-radius: 18px;
            font-size: 14px; font-weight: 600;
            color: #666; cursor: pointer;
            transition: all 0.2s;
        }
        .class-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

        /* 设置按钮 & 面板 */
        .settings-btn {
            position: absolute; right: 20px; top: 20px;
            z-index: 20; width: 48px; height: 48px;
            border-radius: 50%; border: none;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            font-size: 22px; cursor: pointer;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); }

        .settings-panel {
            position: absolute; right: 20px; top: 80px;
            width: 320px;
            max-height: 80vh; overflow-y: auto;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 24px;
            z-index: 19;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: var(--glass-shadow);
        }
        .settings-panel.open { transform: translateX(0); }

        /* 面板内部组件 */
        h3 { margin: 0 0 15px 0; font-size: 18px; color: #000; }
        .section-title { font-size: 12px; text-transform: uppercase; color: #888; margin-top: 20px; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        
        .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .control-label { font-size: 14px; color: #333; font-weight: 500; }
        
        select, input[type=range] { flex: 1; margin-left: 10px; accent-color: var(--accent); }
        select { padding: 6px; border-radius: 8px; border: 1px solid #ddd; background: #fff; }

        .toggle-btn {
            padding: 8px 16px; background: #fff; border: 1px solid #ddd;
            border-radius: 8px; font-size: 13px; cursor: pointer; flex: 1; margin-left: 10px;
        }
        .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* 说明区域 */
        .help-box {
            background: rgba(255,255,255,0.5);
            border-radius: 12px; padding: 12px;
            font-size: 12px; color: #555; line-height: 1.6;
        }
        .help-box strong { color: #000; }

        /* 结果展示 (抽奖) */
        .result-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            display: flex; justify-content: center; align-items: center;
            gap: 30px;
        }
        
        .winner-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 50px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            transform: scale(0.5); opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 200px;
        }
        .winner-card.show { transform: scale(1); opacity: 1; }
        .winner-name { font-size: 60px; font-weight: 800; background: linear-gradient(45deg, #007AFF, #5AC8FA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .winner-id { font-size: 20px; color: #888; margin-top: 5px; font-weight: 600; }

        /* 底部状态条 */
        .status-pill {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            color: #fff; padding: 10px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 600; z-index: 5;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; transition: background 0.3s; }
        .dot.ready { background: #34c759; box-shadow: 0 0 10px #34c759; }

        /* 阵型指示器 */
        .shape-tag {
            position: absolute; bottom: 30px; left: 30px;
            color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 5;
        }
    </style>
</head>

            window.addEventListener('resize', onWindowResize);

        // 创建背景星空
        function createStarField() {
            const geom = new THREE.BufferGeometry();
            const verts = [];
            for(let i=0; i<3000; i++) {
                verts.push((Math.random()-0.5)*8000, (Math.random()-0.5)*8000, (Math.random()-0.5)*8000);
            }
            geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, transparent: true, opacity: 0.6 });
            starField = new THREE.Points(geom, mat);
            scene.add(starField);
        }

        // --- 核心：创建精美的玻璃卡片文字 ---

            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "rgba(255, 255, 255, 0.15)"; // 半透明白

            ctx.lineWidth = 4;
            
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(w-r, 0);
            ctx.quadraticCurveTo(w, 0, w, r);
            ctx.lineTo(w, h-r);
            ctx.quadraticCurveTo(w, h, w-r, h);
            ctx.lineTo(r, h);
            ctx.quadraticCurveTo(0, h, 0, h-r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();

            // 2. 绘制文字 (Apple Style)
            ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 简单的阴影增加立体感
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 8;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, w/2, h/2 + 5);

            return new THREE.CanvasTexture(canvas);
        }

        function createStudents() {
            // 清理
            students.forEach(s => scene.remove(s.mesh));
            students = [];

            currentClassData.forEach((student, i) => {
                const map = createCardTexture(student.name);
                const mat = new THREE.SpriteMaterial({ map: map });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(300, 93, 1); // 保持卡片比例

                // 预计算所有坐标
                const total = currentClassData.length;
                
                // 1. 球体
                const phi = Math.acos(-1 + (2 * i) / total);
                const theta = Math.sqrt(total * Math.PI) * phi;
                const posSphere = new THREE.Vector3(
                    config.radius * Math.cos(theta) * Math.sin(phi),
                    config.radius * Math.sin(theta) * Math.sin(phi),
                    config.radius * Math.cos(phi)
                );

                // 2. 螺旋
                const posHelix = new THREE.Vector3(
                    700 * Math.sin(i * 0.4),
                    (i - total/2) * 35,
                    700 * Math.cos(i * 0.4)
                );

                // 3. 墙
                const col = 8;
                const posGrid = new THREE.Vector3(
                    ((i % col) - col/2) * 350 + 175,
                    (Math.floor(i / col) - total/col/2) * -180 + 300,
                    0
                );

                // 4. 龙卷风 (Tornado)
                const tY = (i / total) * 1600 - 800; // 高度
                const tR = 100 + (i/total) * 700; // 半径随高度变大
                const tAngle = i * 0.5;
                const posTornado = new THREE.Vector3(
                    tR * Math.cos(tAngle),
                    tY,
                    tR * Math.sin(tAngle)
                );

                // 5. 原子 (Atom) - 双环交叉
                const atomAngle = i * (Math.PI*2 / (total/2));
                let posAtom;
                if (i % 2 === 0) {
                    // 水平环
                    posAtom = new THREE.Vector3(800*Math.cos(atomAngle), 0, 800*Math.sin(atomAngle));
                } else {
                    // 竖直环 (倾斜)
                    const x = 800*Math.cos(atomAngle);
                    const y = 800*Math.sin(atomAngle);
                    // 绕Z轴旋转45度
                    posAtom = new THREE.Vector3(x*0.7 - y*0.7, x*0.7 + y*0.7, 0);
                }

                // 6. 土星环
                const posRing = new THREE.Vector3(
                    1100 * Math.cos(i * 0.3),
                    (Math.random()-0.5)*150,
                    1100 * Math.sin(i * 0.3)
                );

                sprite.position.copy(posSphere); // 初始位置

                sprite.userData = { 
                    id: student.id, name: student.name,
                    pos: { sphere: posSphere, helix: posHelix, grid: posGrid, tornado: posTornado, atom: posAtom, ring: posRing }
                };

                scene.add(sprite);
                students.push({ mesh: sprite, data: student });
            });
            transformShape(targetShape);
        }

        // --- 变换逻辑 ---
        function transformShape(shape) {
            targetShape = shape;
            document.getElementById('shapeSelect').value = shape;
            
            const labels = {
                sphere: '粒子球体', helix: 'DNA 双螺旋', grid: '元素周期表',
                tornado: '龙卷风暴', atom: '原子轨道', ring: '土星光环'
            };
            document.getElementById('shapeTag').innerText = "当前: " + labels[shape];

            students.forEach(s => {
                const target = s.mesh.userData.pos[shape] || s.mesh.userData.pos.sphere;
                
                // 随机延迟让动画更自然
                const delay = Math.random() * 500;
                new TWEEN.Tween(s.mesh.position)
                    .to({x: target.x, y: target.y, z: target.z}, 1500)
                    .delay(delay)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
                
                // 旋转归零
                new TWEEN.Tween(s.mesh.rotation)
                    .to({x:0, y:0, z:0}, 1500)
                    .start();
            });
        }

        // --- 点名逻辑 ---
        function startRoll() {
            if(isRolling) return;
            isRolling = true;
            document.getElementById('resultContainer').innerHTML = ''; // 清空之前结果
            
            // 爆炸效果
            students.forEach(s => {
                new TWEEN.Tween(s.mesh.position)
                    .to({
                        x: (Math.random()-0.5)*5000,
                        y: (Math.random()-0.5)*5000,
                        z: (Math.random()-0.5)*5000
                    }, 1000)
                    .easing(TWEEN.Easing.Cubic.In)
                    .start();
            });
        }

        function stopRoll(count) {
            if(!isRolling) return;
            isRolling = false;

            // 选人
            let winners = [];
            let pool = [...students];
            for(let i=0; i<count; i++) {
                if(pool.length==0) break;
                let idx = Math.floor(Math.random()*pool.length);
                winners.push(pool[idx]);
                pool.splice(idx,1);
            }

            // 显示 UI
            const container = document.getElementById('resultContainer');
            winners.forEach(w => {
                const card = document.createElement('div');
                card.className = 'winner-card';
                card.innerHTML = `<h2 class="winner-name">${w.data.name}</h2><div class="winner-id">NO.${w.data.id}</div>`;
                container.appendChild(card);
                setTimeout(() => card.classList.add('show'), 50);
            });

            transformShape(targetShape); // 恢复阵型
        }

        // --- 手势 AI 逻辑 ---
        function onResults(results) {
            document.getElementById('statusDot').classList.add('ready');
            document.getElementById('statusText').innerText = "AI 准备就绪";

            if (!results.multiHandLandmarks) return;

            let leftHand = null, rightHand = null;

            // 区分左右手 (镜像后：Left=右手, Right=左手)
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const lm = results.multiHandLandmarks[i];
                const label = results.multiHandedness[i].label;
                if (label === 'Left') rightHand = lm;
                else leftHand = lm;
            }

            // 1. 左手：虚拟摇杆 (位置控制旋转速度)
            if (leftHand) {
                const cx = leftHand[9].x; // 中指根部 x
                const cy = leftHand[9].y; // 中指根部 y
                
                // 中心死区 0.4 - 0.6，超出则产生速度
                const deadzone = 0.1;
                const center = 0.5;

                // X轴控制 (左右移动 -> Y轴旋转)
                if (Math.abs(cx - center) > deadzone) {
                    manualRotationVelocity.x = (cx - center) * 0.1; // 灵敏度系数
                } else {
                    manualRotationVelocity.x = 0;
                }

                // Y轴控制 (上下移动 -> X轴旋转)
                if (Math.abs(cy - center) > deadzone) {
                    manualRotationVelocity.y = (cy - center) * 0.1;
                } else {
                    manualRotationVelocity.y = 0;
                }

                // 缩放 (捏合)
                const pinch = Math.sqrt(Math.pow(leftHand[4].x - leftHand[8].x, 2) + Math.pow(leftHand[4].y - leftHand[8].y, 2));
                if (pinch > 0.1 && camera.position.z > 500) camera.position.z -= 20;
                if (pinch < 0.05 && camera.position.z < 4000) camera.position.z += 20;

            } else {
                // 手移开后，惯性慢慢停止
                manualRotationVelocity.x *= 0.9;
                manualRotationVelocity.y *= 0.9;
            }

            // 2. 右手：逻辑控制
            if (rightHand) {
                const now = Date.now();
                // 握拳 -> 开始
                if (isFist(rightHand) && !isRolling && now - lastGestureTime > 500) {
                    startRoll();
                    lastGestureTime = now;
                }
                // 各种停止手势
                else if (isRolling && now - lastGestureTime > 1000) {
                    if (isOpenPalm(rightHand)) stopRoll(1);
                    else if (isVictory(rightHand)) stopRoll(2);
                    else if (isOK(rightHand)) stopRoll(3);
                }
            }

            // 3. 双手合十
            if (leftHand && rightHand) {
                const dist = Math.sqrt(Math.pow(leftHand[9].x - rightHand[9].x, 2) + Math.pow(leftHand[9].y - rightHand[9].y, 2));
                if (dist < 0.1 && Date.now() - lastGestureTime > gestureCooldown) {
                    cycleShape();
                    lastGestureTime = Date.now();
                }
            }
        }

        // 简易几何判断
        function dist(a, b) { return Math.sqrt(Math.pow(a.x-b.x,2) + Math.pow(a.y-b.y,2)); }
        function isFist(lm) { return dist(lm[8],lm[0])<0.15 && dist(lm[12],lm[0])<0.15; }
        function isOpenPalm(lm) { return dist(lm[8],lm[0])>0.25 && dist(lm[12],lm[0])>0.25 && dist(lm[16],lm[0])>0.25; }
        function isVictory(lm) { return dist(lm[8],lm[0])>0.2 && dist(lm[12],lm[0])>0.2 && dist(lm[16],lm[0])<0.15; }
        function isOK(lm) { return dist(lm[4],lm[8])<0.05 && dist(lm[12],lm[0])>0.2; }

        function cycleShape() {
            const shapes = ['sphere', 'helix', 'grid', 'tornado', 'atom', 'ring'];
            const idx = shapes.indexOf(targetShape);
            transformShape(shapes[(idx+1)%shapes.length]);
        }

        // --- 交互 UI ---
        function switchClass(c) {
            currentClassData = classes[c];
            createStudents();
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            isRolling = false; document.getElementById('resultContainer').innerHTML = '';
        }

        function toggleSettings() {
            settingsOpen = !settingsOpen;
            document.getElementById('settingsPanel').classList.toggle('open', settingsOpen);
        }

        function toggleCamera() {
            const cam = document.getElementById('cameraPreview');
            const btn = document.getElementById('camToggle');
            cam.classList.toggle('hidden');
            if(cam.classList.contains('hidden')) {
                btn.innerText = "已关闭"; btn.classList.remove('active');
            } else {
                btn.innerText = "开启"; btn.classList.add('active');
            }
        }

        function changeBackground(val) { document.body.className = val; }

        // --- 动画主循环 ---
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            const speedFactor = parseFloat(document.getElementById('speedRange').value); // 0 - 10

            if (isRolling) {
                // 抽奖时的疯狂旋转
                scene.rotation.y += 0.2;
                scene.rotation.x += 0.05;
            } else {
                // 正常状态：自动旋转 + 手动控制
                // 如果左手在操作(有速度)，优先听左手的
                if (Math.abs(manualRotationVelocity.x) > 0.001 || Math.abs(manualRotationVelocity.y) > 0.001) {
                    scene.rotation.y += manualRotationVelocity.x * speedFactor;
                    scene.rotation.x += manualRotationVelocity.y * speedFactor;
                } else {
                    // 否则自动慢转 (基于滑块速度)
                    scene.rotation.y += autoRotationSpeed * speedFactor;
                }
            }
            
            // 星空背景微动
            if(starField) starField.rotation.y -= 0.0002;
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 启动 ---
        initThree();
        animate();

        const videoElement = document.getElementsByClassName('input_video')[0];
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        hands.onResults(onResults);
        
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 320, height: 240
        });
        cameraUtils.start();

    </script>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("shapeTag") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
