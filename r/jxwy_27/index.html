<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛线推演——食物网</title>
    <style>
        :root {
            --container-width: 1000px;
            --container-height: 700px;
            --primary-color: #2A5C3A;
            --secondary-color: #75B855;
            --accent-color: #E74C3C;
            --text-color: #2A5C3A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, #6ab7ff 30%, #87CEEB 40%, #75B855 100%);
            overflow-x: hidden;
            font-family: '楷体', 'KaiTi', 'Microsoft YaHei', serif;
            position: relative;
            padding: 20px;
        }

        /* 山脉背景 */
        .mountains {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            z-index: 0;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, #3a5f3a, #5d8c5d);
            clip-path: polygon(0% 100%, 100% 100%, 50% 0%);
        }

        /* 云朵动画 */
        .clouds {
            position: absolute;
            width: 100%;
            height: 40%;
            top: 0;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: float linear infinite;
            filter: blur(4px);
            z-index: 1;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        @keyframes float {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        /* 标题样式 */
        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 10;
        }

        .title {
            color: var(--primary-color);
            font-size: 3.2em;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        /* 主容器 */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 30px;
            position: relative;
            z-index: 5;
        }

        .container {
            position: relative;
            width: var(--container-width);
            height: var(--container-height);
            background: url('https://www.creativefabrica.com/wp-content/uploads/2021/04/27/Farm-landscape-background-Graphics-11295782-1.jpg') center/cover;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            overflow: hidden;
            border: 5px solid #5d8c5d;
            flex-shrink: 0;
        }

        /* 右侧信息面板 */
        .info-panel {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            width: 350px;
            border: 2px solid var(--primary-color);
        }

        .panel-title {
            color: var(--primary-color);
            font-size: 1.8em;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        .trophic-levels {
            margin-bottom: 25px;
        }

        .level {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(117, 184, 85, 0.15);
        }

        .level-icon {
            font-size: 28px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }

        .level-info h3 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .level-info p {
            color: #3d6949;
            font-size: 0.95em;
        }

        .current-chain {
            background: rgba(231, 76, 60, 0.08);
            border-radius: 10px;
            padding: 15px;
            min-height: 150px;
            border: 1px dashed var(--accent-color);
        }

        .chain-title {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.3em;
        }

        #chain-display {
            font-size: 1.2em;
            color: var(--primary-color);
            line-height: 1.6;
            min-height: 100px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .food-chain {
            margin: 8px 0;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-family: inherit;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }

        .btn.reset {
            background: var(--accent-color);
        }

        /* 生物样式 */
        .organism {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #fff;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            z-index: 2;
            padding: 5px;
        }

        .organism:hover {
            transform: scale(1.15);
            z-index: 3;
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .organism span {
            font-size: 45px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .organism.extinct {
            filter: grayscale(100%) opacity(0.5);
            transform: scale(0.9);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .organism.extinct span {
            font-size: 40px;
        }

        /* 连接线 */
        #lines {
            position: absolute;
            z-index: 1;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        line {
            stroke-width: 4;
            stroke: #E74C3C;
            marker-end: url(#arrowhead);
            transition: all 0.5s;
        }

        line.broken {
            stroke-dasharray: 10, 5;
            stroke: #95a5a6;
            opacity: 0.5;
        }

        /* 生态平衡指示器 */
        .ecosystem-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .indicator-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #2ecc71;
        }

        .ecosystem-indicator.critical .indicator-dot {
            background: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 树木装饰 */
        .tree {
            position: absolute;
            font-size: 80px;
            z-index: 0;
            opacity: 0.8;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.2);
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            
            .info-panel {
                width: 100%;
                max-width: 800px;
            }
        }

        @media (max-width: 768px) {
            :root {
                --container-width: 95vw;
                --container-height: 500px;
            }
            
            .title {
                font-size: 2.2em;
            }
            
            .organism {
                width: 80px;
                height: 80px;
                font-size: 15px;
            }
            
            .organism span {
                font-size: 35px;
            }
        }
    </style>
</head>
<body>
    <!-- 山脉背景 -->
    <div class="mountains">
        <div class="mountain" style="left: 0; width: 300px; height: 180px;"></div>
        <div class="mountain" style="left: 250px; width: 400px; height: 200px;"></div>
        <div class="mountain" style="right: 0; width: 350px; height: 170px;"></div>
    </div>
    
    <!-- 云朵动画 -->
    <div class="clouds" id="cloudContainer"></div>
    
    <!-- 树木装饰 -->
    <div class="tree" style="top: 20px; left: 5%;">🌲</div>
    <div class="tree" style="top: 40px; right: 7%;">🌳</div>
    <div class="tree" style="bottom: 120px; left: 10%;">🌴</div>
    <div class="tree" style="bottom: 100px; right: 12%;">🌲</div>
    
    <!-- 标题区域 -->
    <div class="header">
        <h1 class="title" id="mainTitle">“毛线推演”——食物网</h1>
    </div>
    
    <div class="main-container">
        <!-- 主容器 -->
        <div class="container">
            <!-- 生态平衡指示器 -->
            <div class="ecosystem-indicator" id="ecosystemIndicator">
                <div class="indicator-dot"></div>
                <span>生态系统：平衡</span>
            </div>
            
            <!-- SVG连接线 -->
            <svg id="lines" width="1000" height="700">
                <defs>
                    <marker id="arrowhead" markerWidth="12" markerHeight="8" 
                           refX="10" refY="4" orient="auto">
                        <polygon points="0 0, 10 4, 0 8" fill="#E74C3C"/>
                    </marker>
                </defs>
            </svg>
    
            <!-- 生物 -->
            <div class="organism" id="grass"><span>🌿</span>草</div>
            <div class="organism" id="cow"><span>🐄</span>牛</div>
            <div class="organism" id="sheep"><span>🐑</span>羊</div>
            <div class="organism" id="hare"><span>🐇</span>野兔</div>
            <div class="organism" id="vole"><span>🐭</span>田鼠</div>
            <div class="organism" id="snake"><span>🐍</span>蛇</div>
            <div class="organism" id="wolf"><span>🐺</span>狼</div>
            <div class="organism" id="eagle"><span>🦅</span>鹰</div>
        </div>
        
        <!-- 信息面板 -->
        <div class="info-panel">
            <h2 class="panel-title">食物网信息</h2>
            
            <div class="trophic-levels">
                <div class="level">
                    <div class="level-icon">🌿</div>
                    <div class="level-info">
                        <h3>生产者</h3>
                        <p>通过光合作用制造食物（如草）</p>
                    </div>
                </div>
                
                <div class="level">
                    <div class="level-icon">🐇</div>
                    <div class="level-info">
                        <h3>消费者</h3>
                        <p>吃其他生物的动物</p>
                    </div>
                </div>
            </div>
            
            <div class="current-chain">
                <h3 class="chain-title">食物链关系</h3>
                <div id="chain-display">
                    点击生物查看相关食物链
                </div>
            </div>
            
            <div class="controls">
                <button class="btn reset" id="resetBtn">重置食物网</button>
                <button class="btn" id="infoBtn">食物网说明</button>
            </div>
        </div>
    </div>

    <script>
        // 创建云朵
        function createClouds() {
            const container = document.getElementById('cloudContainer');
            for(let i=0; i<5; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.cssText = `
                    width: ${Math.random()*200 + 100}px;
                    height: ${Math.random()*80 + 40}px;
                    top: ${Math.random()*30 + 10}%;
                    animation-duration: ${Math.random()*40 + 60}s;
                    animation-delay: ${Math.random()*20}s;
                    opacity: ${Math.random()*0.3 + 0.5};
                `;
                
                // 创建云朵形状
                cloud.style.borderRadius = '50%';
                container.appendChild(cloud);
            }
        }
        createClouds();

        // 生物关系
        const relationships = {
            'grass': ['cow', 'sheep', 'hare', 'vole'],
            'vole': ['snake'],
            'hare': ['wolf', 'eagle'],
            'sheep': ['wolf'],
            'snake': ['eagle']
        };
        
        // 生物名称映射
        const organismNames = {
            'grass': '草',
            'cow': '牛',
            'sheep': '羊',
            'hare': '野兔',
            'vole': '田鼠',
            'snake': '蛇',
            'wolf': '狼',
            'eagle': '鹰'
        };
        
        // 完整的食物链列表
        const fullFoodChains = [
            ['grass', 'cow'],
            ['grass', 'sheep'],
            ['grass', 'hare'],
            ['grass', 'vole'],
            ['grass', 'sheep', 'wolf'],
            ['grass', 'hare', 'wolf'],
            ['grass', 'hare', 'eagle'],
            ['grass', 'vole', 'snake'],
            ['grass', 'vole', 'snake', 'eagle']
        ];

        // 环形布局系统
        const centerX = 500, centerY = 350;
        const radius = 280;
        const angles = Array.from({length:8}, (_,i) => (i * 45 - 20) * Math.PI / 180);
        const organisms = ['grass','cow','sheep','hare','vole','snake','wolf','eagle'];

        // 精确定位
        organisms.forEach((id, index) => {
            const el = document.getElementById(id);
            const angle = angles[index];
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            el.style.left = `${x - 50}px`;
            el.style.top = `${y - 50}px`;
        });

        // 连接线系统
        let connections = [];
        const svg = document.getElementById('lines');
        let extinctCount = 0;
        const ecosystemIndicator = document.getElementById('ecosystemIndicator');

        // 精确计算连接点
        function calculateConnectionPoints(source, target) {
            const sRect = source.getBoundingClientRect();
            const tRect = target.getBoundingClientRect();
            const containerRect = document.querySelector('.container').getBoundingClientRect();

            const sCenter = {
                x: sRect.left - containerRect.left + sRect.width/2,
                y: sRect.top - containerRect.top + sRect.height/2
            };

            const tCenter = {
                x: tRect.left - containerRect.left + tRect.width/2,
                y: tRect.top - containerRect.top + tRect.height/2
            };

            const dx = tCenter.x - sCenter.x;
            const dy = tCenter.y - sCenter.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const angle = Math.atan2(dy, dx);

            // 边缘接触点计算
            return {
                x1: sCenter.x + Math.cos(angle) * 48,
                y1: sCenter.y + Math.sin(angle) * 48,
                x2: tCenter.x - Math.cos(angle) * 48,
                y2: tCenter.y - Math.sin(angle) * 48
            };
        }

        // 创建连接线
        function createConnection(sourceId, targetId) {
            const source = document.getElementById(sourceId);
            const target = document.getElementById(targetId);
            const {x1, y1, x2, y2} = calculateConnectionPoints(source, target);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.dataset.source = sourceId;
            line.dataset.target = targetId;

            svg.appendChild(line);
            connections.push(line);
            return line;
        }

        // 初始化连接
        function initConnections() {
            Object.entries(relationships).forEach(([source, targets]) => {
                targets.forEach(target => createConnection(source, target));
            });
        }
        initConnections();

        // 更新食物链显示
        function updateChainDisplay(organismId) {
            const chainDisplay = document.getElementById('chain-display');
            
            // 查找包含当前生物的所有食物链
            const relatedChains = fullFoodChains.filter(chain => 
                chain.includes(organismId)
            );
            
            if (relatedChains.length === 0) {
                chainDisplay.innerHTML = `<div>${organismNames[organismId]}没有捕食关系</div>`;
                return;
            }
            
            let chainHTML = `<div class="chain-title">${organismNames[organismId]}的食物链</div>`;
            
            // 显示所有相关的食物链
            relatedChains.forEach(chain => {
                const chainStr = chain.map(id => organismNames[id]).join(' → ');
                chainHTML += `<div class="food-chain">${chainStr}</div>`;
            });
            
            chainDisplay.innerHTML = chainHTML;
        }

        // 更新生态系统状态
        function updateEcosystemStatus() {
            const grassExtinct = organismState['grass'];
            
            if (grassExtinct) {
                // 生产者灭绝 - 生态崩溃
                ecosystemIndicator.classList.add('critical');
                ecosystemIndicator.innerHTML = '<div class="indicator-dot"></div><span>生态系统：崩溃！</span>';
                document.body.style.background = 'linear-gradient(to bottom, #ff9f9f 30%, #ff6b6b 40%, #e74c3c 100%)';
            } else if (extinctCount >= 3) {
                // 三个以上消费者灭绝
                ecosystemIndicator.classList.add('critical');
                ecosystemIndicator.innerHTML = '<div class="indicator-dot"></div><span>生态系统：濒临崩溃！</span>';
                document.body.style.background = 'linear-gradient(to bottom, #ff9f9f 30%, #ff6b6b 40%, #e74c3c 100%)';
            } else if (extinctCount > 0) {
                // 1-2个消费者灭绝
                ecosystemIndicator.innerHTML = '<div class="indicator-dot"></div><span>生态系统：轻微失衡</span>';
                document.body.style.background = 'linear-gradient(to bottom, #ffd699 30%, #ffb366 40%, #ff8c1a 100%)';
            } else {
                // 生态系统平衡
                ecosystemIndicator.classList.remove('critical');
                ecosystemIndicator.innerHTML = '<div class="indicator-dot"></div><span>生态系统：平衡</span>';
                document.body.style.background = 'linear-gradient(to bottom, #6ab7ff 30%, #87CEEB 40%, #75B855 100%)';
            }
        }

        // 交互系统
        const organismState = {};
        document.querySelectorAll('.organism').forEach(org => {
            org.addEventListener('click', function() {
                const id = this.id;
                
                // 切换状态
                organismState[id] = !organismState[id];
                
                // 更新UI
                this.classList.toggle('extinct', organismState[id]);
                
                // 更新计数
                if (organismState[id]) {
                    extinctCount++;
                } else {
                    extinctCount--;
                }
                
                // 动画效果
                this.animate([
                    { transform: 'scale(1.2)', opacity: 1 },
                    { transform: 'scale(1)', opacity: 0.8 }
                ], {
                    duration: 500,
                    iterations: 1
                });
                
                // 更新连接线
                connections.forEach(line => {
                    const source = line.dataset.source;
                    const target = line.dataset.target;
                    
                    if (organismState[source] || organismState[target]) {
                        line.classList.add('broken');
                    } else {
                        line.classList.remove('broken');
                    }
                });
                
                // 更新信息显示
                updateChainDisplay(id);
                updateEcosystemStatus();
            });
            
            // 添加悬停效果 - 显示食物链关系
            org.addEventListener('mouseenter', function() {
                updateChainDisplay(this.id);
            });
        });

        // 重置按钮
        document.getElementById('resetBtn').addEventListener('click', function() {
            // 重置所有生物状态
            document.querySelectorAll('.organism').forEach(org => {
                org.classList.remove('extinct');
                organismState[org.id] = false;
            });
            
            // 重置连接线
            connections.forEach(line => {
                line.classList.remove('broken');
            });
            
            // 重置计数
            extinctCount = 0;
            
            // 更新状态
            updateEcosystemStatus();
            document.getElementById('chain-display').innerHTML = '食物网已重置<br>点击生物查看食物链';
        });

        // 信息按钮
        document.getElementById('infoBtn').addEventListener('click', function() {
            document.getElementById('chain-display').innerHTML = `
                <div class="food-chain">草 → 牛</div>
                <div class="food-chain">草 → 羊</div>
                <div class="food-chain">草 → 羊 → 狼</div>
                <div class="food-chain">草 → 野兔</div>
                <div class="food-chain">草 → 野兔 → 狼</div>
                <div class="food-chain">草 → 野兔 → 鹰</div>
                <div class="food-chain">草 → 田鼠 → 蛇</div>
                <div class="food-chain">草 → 田鼠 → 蛇 → 鹰</div>
            `;
        });

        // 初始化显示
        document.getElementById('chain-display').innerHTML = `
            <div style="text-align:center; padding:10px;">
                <div style="font-size:1.3em; margin-bottom:10px;">🌿 食物网说明 🌿</div>
                <div>点击生物模拟其灭绝</div>
                <div>观察食物链的连锁反应</div>
            </div>
        `;

        // 窗口resize处理
        window.addEventListener('resize', () => {
            connections.forEach(line => line.remove());
            connections = [];
            initConnections();
        });
    </script>

    font-size: 16px;

<div id="kaiming-copyright">
  <div class="inner">© 2026 开物AI科学 ｜ AI 赋能 · 教育公平</div>
</div>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("mainTitle") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
