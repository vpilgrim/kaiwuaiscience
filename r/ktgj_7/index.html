<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D磁悬浮列车 · 速度进化（优化版）</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas {
            display: block;
        }
        #top-right-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #4a9eff;
            border-radius: 16px;
            padding: 12px 10px;
            color: white;
            box-shadow: 0 0 20px rgba(0,160,255,0.3);
            z-index: 50;
            text-align: center;
        }
        #panel-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 8px;
            border-bottom: 1px solid #4a9eff;
            padding-bottom: 5px;
            letter-spacing: 2px;
        }
        #leaderboard {
            width: 100%;
            font-size: 12px;
        }
        #leaderboard h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: bold;
            color: #ffd966;
            border-bottom: 1px solid #4a9eff;
            padding-bottom: 4px;
            letter-spacing: 1px;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            padding: 4px 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            border-left: 3px solid #4a9eff;
            font-size: 11px;
            transition: all 0.2s;
        }
        .leaderboard-item.max-speed {
            border-left-color: #ffaa00;
            background: rgba(255, 200, 0, 0.15);
        }
        .leaderboard-rank {
            font-weight: bold;
            width: 22px;
            color: #ffd966;
        }
        .leaderboard-icon {
            font-size: 14px;
            margin-right: 5px;
            width: 20px;
            text-align: center;
        }
        .leaderboard-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .leaderboard-speed {
            font-weight: bold;
            background: #0a2a4a;
            padding: 2px 6px;
            border-radius: 20px;
            color: #aaf0ff;
            font-size: 10px;
        }
        .leaderboard-item.max-speed .leaderboard-speed {
            background: #aa5500;
            color: #ffffaa;
        }
        .train-label {
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            background: rgba(0, 30, 60, 0.8);
            padding: 4px 12px;
            border-radius: 40px;
            border: 2px solid #7ec8ff;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(78, 198, 255, 0.5);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .train-label.max-speed {
            border-color: #ffaa00;
            box-shadow: 0 0 20px #ffaa00;
        }
        .train-label .emoji {
            font-size: 24px;
            line-height: 1;
        }
        .train-label .speed-text {
            font-size: 14px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="top-right-panel">
        <div id="panel-title">🚄 磁悬浮积分系统</div>
        <div id="leaderboard">
            <h3>🏆 速度前五 🏆</h3>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 配置 ---
        const GROUP_COUNT = 10;
        const BASE_SPEED = 100;          
        const SPEED_STEP = 200;           
        const MAX_SPEED = 1000;            
        
        const MOVE_FACTOR = 5.0 / 100; 
        const TRACK_START = -40;
        const TRACK_END = 20;
        const TRAIN_START_Z = -35;  

        let speeds = new Array(GROUP_COUNT).fill(BASE_SPEED);
        
        const trainGroups = [];          
        const trainLabels = [];           
        const clickBoxes = [];            
        const trainColors = [];

        // 存储临时爆发粒子
        const burstParticles = [];

        function getIconForSpeed(speed) {
            if (speed >= 900) return '🚀';
            if (speed >= 700) return '🚝';
            if (speed >= 500) return '🚅';
            if (speed >= 300) return '🚈';
            return '🚄';
        }

        function getDisplaySpeed(speed) {
            if (speed >= 1000) return '1000 km/h 🚀';
            return speed + ' km/h';
        }

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x112233);
        scene.fog = new THREE.Fog(0x112233, 100, 300); 

        // 相机视角保持不变
        const camera = new THREE.PerspectiveCamera(20, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-55, 100, 0); 
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.target.set(0, 0, -10);
        controls.maxDistance = 300; 
        controls.minDistance = 30;

        // --- 灯光系统 (微调：增加一点暖色) ---
        const hemiLight = new THREE.HemisphereLight(0x88aaff, 0x332211, 1.0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.0);
        dirLight.position.set(0, 60, 0); 
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 70;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 120;
        scene.add(dirLight);

        const backLight = new THREE.PointLight(0x88aaff, 0.5);
        backLight.position.set(0, 30, -50);
        scene.add(backLight);

        const fillLight1 = new THREE.PointLight(0x88aaff, 0.4);
        fillLight1.position.set(40, 20, 20);
        scene.add(fillLight1);
        
        const fillLight2 = new THREE.PointLight(0x88aaff, 0.4);
        fillLight2.position.set(-40, 20, 20);
        scene.add(fillLight2);

        // --- 背景网格 (透明度降低) ---
        const gridHelper = new THREE.GridHelper(300, 80, 0x4a9eff, 0x224466);
        gridHelper.position.y = -0.5;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.15; // 降低到0.15
        scene.add(gridHelper);

        // --- 轨道优化：U型槽，护栏材质增强 ---
        const spacingX = 4.2;            
        const startX = - (GROUP_COUNT - 1) * spacingX / 2; 
        const trackLength = TRACK_END - TRACK_START;

        for (let i = 0; i < GROUP_COUNT; i++) {
            const xPos = startX + i * spacingX;
            const trackGroup = new THREE.Group();
            trackGroup.position.set(xPos, 0, (TRACK_START + TRACK_END)/2);
            
            // 底部基座
            const trackBaseGeo = new THREE.BoxGeometry(2.4, 0.2, trackLength);
            const trackBaseMat = new THREE.MeshStandardMaterial({ color: 0x2a4a6a, roughness: 0.7 });
            const trackBase = new THREE.Mesh(trackBaseGeo, trackBaseMat);
            trackBase.position.y = -0.1;
            trackBase.receiveShadow = true;
            trackGroup.add(trackBase);

            // 两侧护栏 (材质金属感增强)
            const wallGeo = new THREE.BoxGeometry(0.3, 0.4, trackLength);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a6a9a, roughness: 0.4, metalness: 0.6 });
            
            const wallLeft = new THREE.Mesh(wallGeo, wallMat);
            wallLeft.position.set(-1.05, 0.2, 0);
            wallLeft.receiveShadow = true;
            trackGroup.add(wallLeft);
            
            const wallRight = new THREE.Mesh(wallGeo, wallMat);
            wallRight.position.set(1.05, 0.2, 0);
            wallRight.receiveShadow = true;
            trackGroup.add(wallRight);

            // 两条铁轨 (保持原样)
            const railMat = new THREE.MeshStandardMaterial({ color: 0xccccff, metalness: 0.9, roughness: 0.2 });
            const railGeo = new THREE.BoxGeometry(0.25, 0.15, trackLength);
            
            const railLeft = new THREE.Mesh(railGeo, railMat);
            railLeft.position.set(-0.6, 0.1, 0);
            railLeft.receiveShadow = true;
            trackGroup.add(railLeft);
            
            const railRight = new THREE.Mesh(railGeo, railMat);
            railRight.position.set(0.6, 0.1, 0);
            railRight.receiveShadow = true;
            trackGroup.add(railRight);

            // 轨道两侧发光线圈 (保留)
            const coilMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: new THREE.Color(0x3366aa) });
            for (let zOffset = -trackLength/2 + 5; zOffset <= trackLength/2 - 5; zOffset += 6) {
                const coilLeft = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.07, 12, 20), coilMat);
                coilLeft.rotation.x = Math.PI / 2;
                coilLeft.position.set(-1.2, 0.4, zOffset);
                trackGroup.add(coilLeft);
                
                const coilRight = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.07, 12, 20), coilMat);
                coilRight.rotation.x = Math.PI / 2;
                coilRight.position.set(1.2, 0.4, zOffset);
                trackGroup.add(coilRight);
            }

            scene.add(trackGroup);

            // 点击盒
            const trackClickGeo = new THREE.BoxGeometry(3.0, 1.0, trackLength);
            const trackClickMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
            const trackClickBox = new THREE.Mesh(trackClickGeo, trackClickMat);
            trackClickBox.position.set(xPos, 0.5, (TRACK_START + TRACK_END)/2);
            trackClickBox.userData = { groupIndex: i };
            scene.add(trackClickBox);
            clickBoxes.push(trackClickBox);
        }

        // --- 火车优化：增强悬浮粒子，动态颜色 ---
        function createTrain(index, initialSpeed) {
            const group = new THREE.Group();
            const hue = (index / GROUP_COUNT) * 360;
            const colorMain = new THREE.Color(`hsl(${hue}, 90%, 60%)`);
            trainColors[index] = colorMain;

            const carLength = 2.2;
            const carSpacing = 0.4;
            const totalTrainLength = 6 * carLength + 5 * carSpacing; 
            
            for (let j = 0; j < 6; j++) {
                const offsetZ = (j - 2.5) * (carLength + carSpacing);
                const carGroup = new THREE.Group();
                
                // 车厢主体
                const bodyGeo = new THREE.BoxGeometry(1.8, 0.7, carLength);
                const bodyMat = new THREE.MeshStandardMaterial({ color: colorMain, roughness: 0.3, metalness: 0.4 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                body.receiveShadow = true;
                body.position.y = 0.45;
                carGroup.add(body);

                // 子弹头
                if (j === 5) {
                    const headGeo = new THREE.SphereGeometry(0.9, 32, 16);
                    const head = new THREE.Mesh(headGeo, bodyMat);
                    head.scale.set(1, 0.7/0.9, 1.5);
                    head.position.set(0, 0.45, carLength / 2);
                    head.castShadow = true;
                    carGroup.add(head);
                }
                if (j === 0) {
                    const tailGeo = new THREE.SphereGeometry(0.9, 32, 16);
                    const tail = new THREE.Mesh(tailGeo, bodyMat);
                    tail.scale.set(1, 0.7/0.9, 1.5);
                    tail.position.set(0, 0.45, -carLength / 2);
                    tail.castShadow = true;
                    carGroup.add(tail);
                }

                // 侧面装饰条纹
                const stripeGeo = new THREE.BoxGeometry(1.85, 0.1, carLength - 0.2);
                const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: new THREE.Color(0x442200) });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.position.set(0, 0.25, 0);
                carGroup.add(stripe);

                // 车窗
                const windowGeo = new THREE.BoxGeometry(1.3, 0.35, carLength*0.7);
                const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: new THREE.Color(0x113355) });
                const windowMesh = new THREE.Mesh(windowGeo, windowMat);
                windowMesh.position.y = 0.75;
                carGroup.add(windowMesh);

                // 车顶
                const roofGeo = new THREE.CylinderGeometry(0.7, 0.7, carLength - 0.2, 8);
                roofGeo.rotateX(Math.PI / 2);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.2, metalness: 0.8 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 0.8;
                roof.scale.set(1, 0.4, 1);
                carGroup.add(roof);

                // 天线
                if (j === 5) {
                    const antennaBase = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8), new THREE.MeshStandardMaterial({ color: 0xffaa00 }));
                    antennaBase.position.set(0, 1.1, 0.8);
                    carGroup.add(antennaBase);
                    
                    const antennaRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
                    antennaRod.position.set(0, 1.3, 0.8);
                    carGroup.add(antennaRod);
                    
                    const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6), new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: new THREE.Color(0x331100) }));
                    antennaBall.position.set(0, 1.52, 0.8);
                    carGroup.add(antennaBall);
                }

                // 底部悬浮装置 (加宽)
                const magnetMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.9, emissive: new THREE.Color(0x112233) });
                const magnetGeo = new THREE.BoxGeometry(1.6, 0.2, carLength*0.9);
                const magnet = new THREE.Mesh(magnetGeo, magnetMat);
                magnet.position.set(0, 0.1, 0);
                carGroup.add(magnet);

                carGroup.position.z = offsetZ;
                carGroup.position.y = 0.3;
                group.add(carGroup);
            }

            // --- 增强悬浮粒子 (颜色与车身相近，尺寸略大) ---
            const particleCount = 40;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleColors = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlePositions[i*3] = (Math.random() - 0.5) * 3.5;
                particlePositions[i*3+1] = 0.0 + Math.random() * 0.3;
                particlePositions[i*3+2] = (Math.random() - 0.5) * 16;
                
                // 粒子颜色：车身颜色的亮色版本
                const col = colorMain.clone().multiplyScalar(1.5);
                particleColors[i*3] = col.r;
                particleColors[i*3+1] = col.g;
                particleColors[i*3+2] = col.b;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
            const particleMat = new THREE.PointsMaterial({ 
                size: 0.2, 
                vertexColors: true, 
                transparent: true, 
                blending: THREE.AdditiveBlending,
                opacity: 0.8
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            group.add(particles);
            group.userData.particles = particles;

            // 标签
            const labelDiv = document.createElement('div');
            labelDiv.className = 'train-label';
            labelDiv.innerHTML = `
                <span class="emoji">${getIconForSpeed(initialSpeed)}</span>
                <span class="speed-text">组${index+1} ${getDisplaySpeed(initialSpeed)}</span>
            `;
            labelDiv.style.borderColor = `hsl(${hue}, 100%, 70%)`;
            
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, 2.8 + (index % 3) * 0.2 - 0.2, totalTrainLength/2 - 0.8);
            group.add(label);
            trainLabels[index] = label;

            group.userData = { groupIndex: index, speed: initialSpeed, color: colorMain };
            return group;
        }

        for (let i = 0; i < GROUP_COUNT; i++) {
            const train = createTrain(i, speeds[i]);
            train.position.set(startX + i * spacingX, 0.4, TRAIN_START_Z); 
            scene.add(train);
            trainGroups.push(train);
        }

        // --- 逻辑更新与交互 ---
        function updateTrainPosition(index) {
            const train = trainGroups[index];
            const speed = speeds[index];
            const offsetZ = (speed - BASE_SPEED) * MOVE_FACTOR;
            const maxOffset = TRACK_END - 1.0 - TRAIN_START_Z; 
            const clampedOffset = Math.min(offsetZ, maxOffset);
            train.position.z = TRAIN_START_Z + clampedOffset; 
        }

        for (let i = 0; i < GROUP_COUNT; i++) { updateTrainPosition(i); }

        function updateGroupDisplay(index) {
            const speed = speeds[index];
            if (trainLabels[index]) {
                const labelDiv = trainLabels[index].element;
                labelDiv.querySelector('.emoji').textContent = getIconForSpeed(speed);
                labelDiv.querySelector('.speed-text').textContent = `组${index+1} ${getDisplaySpeed(speed)}`;
                
                // 高速时标签高亮
                if (speed >= 1000) {
                    labelDiv.classList.add('max-speed');
                } else {
                    labelDiv.classList.remove('max-speed');
                }
            }
            updateTrainPosition(index);
        }

        function updateLeaderboard() {
            const entries = speeds.map((speed, idx) => ({ idx, speed }));
            entries.sort((a, b) => b.speed - a.speed);
            const top5 = entries.slice(0, 5);
            
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';
            
            top5.forEach((item, pos) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-item';
                if (item.speed >= 1000) div.classList.add('max-speed');
                div.innerHTML = `
                    <span class="leaderboard-rank">${pos + 1}</span>
                    <span class="leaderboard-icon">${getIconForSpeed(item.speed)}</span>
                    <span class="leaderboard-name">组${item.idx+1}</span>
                    <span class="leaderboard-speed">${getDisplaySpeed(item.speed)}</span>
                `;
                leaderboardList.appendChild(div);
            });
        }

        updateLeaderboard();

        // --- 点击粒子爆发效果 ---
        function createBurstParticles(x, y, z, color) {
            const count = 20;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i*3] = (Math.random() - 0.5) * 2;
                positions[i*3+1] = Math.random() * 1;
                positions[i*3+2] = (Math.random() - 0.5) * 2;
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 1 });
            const particles = new THREE.Points(geo, mat);
            particles.position.set(x, y, z);
            scene.add(particles);
            
            // 存储动画数据
            burstParticles.push({
                mesh: particles,
                life: 1.0,
                speed: 0.02 + Math.random() * 0.02,
                velocities: Array.from({ length: count }, () => new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    Math.random() * 0.1,
                    (Math.random() - 0.5) * 0.1
                ))
            });
        }

        // --- 点击事件 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleClick(event) {
            event.preventDefault();
            const rect = renderer.domElement.getBoundingClientRect();
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(clickBoxes);
            if (intersects.length > 0) {
                const hitBox = intersects[0].object;
                const groupIndex = hitBox.userData.groupIndex;
                if (speeds[groupIndex] < MAX_SPEED) {
                    speeds[groupIndex] = Math.min(speeds[groupIndex] + SPEED_STEP, MAX_SPEED);
                    updateGroupDisplay(groupIndex);
                    updateLeaderboard();
                    
                    const train = trainGroups[groupIndex];
                    if (train) {
                        train.userData.boost = 0.3;
                        train.children.forEach(child => {
                            if (child.isMesh && child.material && child.material.color && !(child.material instanceof THREE.MeshBasicMaterial && child.material.transparent)) {
                                if (!child.userData.originalColor) child.userData.originalColor = child.material.color.clone();
                                child.material.color.setHex(0xffffff);
                                setTimeout(() => child.material.color.copy(child.userData.originalColor), 150);
                            }
                        });
                        
                        // 添加爆发粒子
                        const pos = train.position.clone();
                        pos.y += 1.0;
                        createBurstParticles(pos.x, pos.y, pos.z, trainColors[groupIndex]);
                    }
                }
            }
        }

        renderer.domElement.addEventListener('click', handleClick);
        renderer.domElement.addEventListener('touchstart', handleClick, { passive: false });

        // --- 全局粒子 (稍微调亮) ---
        const globalParticleGeo = new THREE.BufferGeometry();
        const globalParticleCount = 700;
        const globalPositions = new Float32Array(globalParticleCount * 3);
        for (let i = 0; i < globalParticleCount * 3; i += 3) {
            globalPositions[i] = (Math.random() - 0.5) * 150;
            globalPositions[i+1] = Math.random() * 40;
            globalPositions[i+2] = (Math.random() - 0.5) * 120;
        }
        globalParticleGeo.setAttribute('position', new THREE.BufferAttribute(globalPositions, 3));
        const globalParticleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.5, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const globalParticles = new THREE.Points(globalParticleGeo, globalParticleMat);
        scene.add(globalParticles);

        // --- 动画循环 (包含爆发粒子更新) ---
        let clock = new THREE.Clock();
        function animate() {
            const elapsedTime = performance.now() / 1000;

            trainGroups.forEach((train, idx) => {
                let floatY = Math.sin(elapsedTime * 2.0 + idx * 0.8) * 0.12;
                if (train.userData.boost && train.userData.boost > 0) {
                    floatY += train.userData.boost;
                    train.userData.boost *= 0.9;
                    if (train.userData.boost < 0.01) train.userData.boost = 0;
                }
                train.position.y = 0.4 + floatY;
                if (train.userData.particles) {
                    train.userData.particles.rotation.y += 0.01;
                    // 粒子闪烁
                    const material = train.userData.particles.material;
                    material.opacity = 0.6 + Math.sin(elapsedTime * 5 + idx) * 0.3;
                }
            });

            // 更新爆发粒子
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const bp = burstParticles[i];
                bp.life -= 0.02;
                if (bp.life <= 0) {
                    scene.remove(bp.mesh);
                    burstParticles.splice(i, 1);
                    continue;
                }
                bp.mesh.material.opacity = bp.life;
                // 简单动画：向外扩散
                const positions = bp.mesh.geometry.attributes.position.array;
                for (let j = 0; j < positions.length / 3; j++) {
                    positions[j*3] += bp.velocities[j].x;
                    positions[j*3+1] += bp.velocities[j].y;
                    positions[j*3+2] += bp.velocities[j].z;
                }
                bp.mesh.geometry.attributes.position.needsUpdate = true;
            }

            globalParticles.rotation.y += 0.0002;
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("panel-title") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
