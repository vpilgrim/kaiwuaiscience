<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>小学科学 - 气温计教学工具</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #e3f0fa 0%, #b8cfe0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: 96vh;
            max-height: 920px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.18);
            display: flex;
            padding: 18px 20px 16px 16px;
            gap: 16px;
            overflow: hidden;
        }

        .left-panel {
            width: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #1a4d7a, #2b6a9e);
            border-radius: 32px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.15), 4px 6px 12px rgba(0, 0, 0, 0.12);
            padding: 16px 0;
        }
        /* 放大标题 */
        .vertical-title {
            writing-mode: vertical-rl;
            letter-spacing: 16px;
            font-size: 2rem;
            font-weight: 700;
            color: #f7f3e0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .vertical-title .emoji {
            font-size: 2.6rem;
            letter-spacing: 2px;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 0 8px;
            position: relative;
            height: 100%;
        }
        .thermo-area {
            background: #fef9ec;
            padding: 12px 16px 10px;
            border-radius: 60px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 700px;
            justify-content: center;
        }
        .thermometer-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 80%;
            max-height: 520px;
        }

        .thermometer {
            position: relative;
            width: 12%;
            min-width: 40px;
            max-width: 80px;
            height: 100%;
            background: linear-gradient(to top,
                    #9bc5f0 0%, #9fe0a5 20%, #f9f0a3 45%,
                    #fbc28e 70%, #f99c7a 100%);
            border: 4px solid #1f332a;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1), 4px 6px 16px rgba(0, 0, 0, 0.16);
            flex-shrink: 0;
        }
        .mercury {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, #d63000, #b51f00);
            height: 50%;
            transition: height 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 0 0 12px 12px;
            will-change: height;
            overflow: visible;
        }
        
        /* 锐化凹液面，增加边缘深色过渡，使其不模糊 */
        .mercury-top {
            position: absolute;
            bottom: 100%; 
            left: 0;
            right: 0;
            height: 12px;
            background: radial-gradient(ellipse at 50% -15%, transparent 59%, #4a0c00 60%, #d63000 65%, #b51f00 100%);
            pointer-events: none;
            z-index: 3;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .mercury .mercury-top.show {
            opacity: 1;
        }

        .bulb {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            background: radial-gradient(circle at 30% 30%, #ff5e2e, #b51f00);
            border: 4px solid #1f332a;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 44px;
            aspect-ratio: 1/1;
        }

        .right-scale {
            position: relative;
            width: 16%;
            min-width: 52px;
            max-width: 80px;
            height: 100%;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .scale-line {
            position: absolute;
            left: 0;
            height: 1.5px;
            background-color: #7a6a5a;
        }
        .scale-line.major {
            width: 20px;
            height: 2.5px;
            background-color: #1a2c24;
        }
        .scale-line.medium {
            width: 16px;
            height: 2px;
            background-color: #5a4a3a;
        }
        .scale-line.minor {
            width: 10px;
            height: 1.2px;
            background-color: #a09080;
        }
        /* 放大刻度数字 */
        .scale-value {
            position: absolute;
            left: 24px;
            transform: translateY(-50%);
            font-size: clamp(14px, 1.6vw, 20px);
            font-weight: 700;
            color: #1f3b3c;
            background: rgba(255, 248, 220, 0.85);
            padding: 2px 6px;
            border-radius: 14px;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }

        /* 放大底部主温度显示 */
        .current-temp {
            font-size: clamp(1.8rem, 3.2vw, 3.5rem);
            font-weight: 700;
            margin-top: 12px;
            background: #1d2e3c;
            color: #f7edd5;
            padding: 6px 28px;
            border-radius: 50px;
            box-shadow: inset 0 -2px 0 #0f1a24, 0 6px 14px rgba(0, 0, 0, 0.10);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            min-width: 120px;
            text-align: center;
        }

        /* 放大镜 */
        .magnifier-overlay {
            position: absolute;
            right: -18%;
            top: 50%;
            transform: translateY(-50%) scale(0.92);
            width: 32%;
            min-width: 220px;
            max-width: 300px;
            aspect-ratio: 0.48;
            background: rgba(255, 252, 240, 0.97);
            border: 3px solid #1f332a;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
            padding: 14px 12px 12px 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }
        .magnifier-overlay.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }
        /* 放大镜标题放大 */
        .magnifier-overlay .mag-title {
            font-size: clamp(1.1rem, 1.4vw, 1.4rem);
            font-weight: 700;
            color: #1f332a;
            margin-bottom: 8px;
            text-align: center;
            background: #e8ddd0;
            padding: 4px 16px;
            border-radius: 20px;
            align-self: center;
        }
        .mag-scale-wrap {
            position: relative;
            width: 100%;
            flex: 1;
            border-radius: 16px;
            background: #fcf8ee;
            overflow: hidden;
            border: 1px solid #cbbaa8;
        }
        .mag-scale-wrap .mag-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #7a6a5a;
            z-index: 3;
        }
        .mag-scale-wrap .mag-line.major {
            height: 3.5px;
            background: #1f332a;
        }
        .mag-scale-wrap .mag-line.medium {
            height: 2.5px;
            background: #5a4a3a;
        }
        .mag-scale-wrap .mag-line.minor {
            height: 1.5px;
            background: #b0a090;
        }
        /* 放大镜内刻度数字放大 */
        .mag-scale-wrap .mag-label {
            position: absolute;
            right: 8px;
            transform: translateY(-50%);
            font-size: clamp(1.2rem, 1.6vw, 1.8rem);
            font-weight: 700;
            color: #1f332a;
            font-family: 'Courier New', monospace;
            background: rgba(255, 248, 220, 0.85);
            padding: 2px 6px;
            border-radius: 8px;
            z-index: 3;
        }
        
        .mag-liquid {
            position: absolute;
            left: 20%;
            width: 60%;
            background: linear-gradient(180deg, #d63000, #b51f00);
            z-index: 1;
        }
        /* 放大镜液柱顶端同等锐化 */
        .mag-meniscus {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 24px;
            transform: translateY(-100%);
            background: radial-gradient(ellipse at 50% -15%, transparent 59%, #4a0c00 60%, #d63000 65%, #b51f00 100%);
            z-index: 1;
        }
        /* 纯虚线指示器，无文字遮挡 */
        .mag-indicator-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0;
            border-top: 2px dashed #ff2a00;
            z-index: 5;
            pointer-events: none;
        }

        .mag-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #c0392b;
            color: #fff;
            border: 2px solid #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            transition: 0.15s;
            line-height: 1;
        }
        .mag-close:hover {
            transform: scale(1.12);
            background: #e74c3c;
        }

        /* 增宽右侧面板以容纳大号字体 */
        .right-panel {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 4px;
        }

        .ctrl-group {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 16px 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* 放大控制面板按钮及文字 */
        .ctrl-group button {
            background: linear-gradient(135deg, #2d7a4f, #1e5a3a);
            border: none;
            color: #fff;
            padding: 16px 10px;
            font-size: clamp(1.1rem, 1.3vw, 1.3rem);
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.18s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .ctrl-group button:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
        }
        .ctrl-group button:active {
            transform: translateY(1px);
        }
        .ctrl-group button.icon-btn {
            background: linear-gradient(135deg, #3a6ea5, #28537c);
        }
        .scale-switch {
            display: flex;
            gap: 10px;
        }
        .scale-switch button {
            flex: 1;
            font-size: clamp(1rem, 1.1vw, 1.2rem);
            padding: 12px 6px;
            background: linear-gradient(135deg, #3a6ea5, #28537c);
        }
        .scale-switch button.active-btn {
            background: linear-gradient(135deg, #f5a623, #e07b1a);
            color: #1f1a0e;
            box-shadow: inset 0 -2px 0 #b85f1a;
        }
        .scale-hint {
            background: #e8f0fa;
            padding: 10px;
            border-radius: 30px;
            font-size: clamp(0.95rem, 1vw, 1.1rem);
            font-weight: 600;
            color: #1c5c7c;
            text-align: center;
        }

        .accordion {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            flex-shrink: 0;
        }
        /* 放大百科标题 */
        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: clamp(1.1rem, 1.2vw, 1.3rem);
            color: #1a4d7a;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            gap: 6px;
        }
        .accordion-header:hover {
            background: rgba(26, 77, 122, 0.06);
        }
        .accordion-header .arrow {
            transition: transform 0.3s;
            font-size: 1rem;
        }
        .accordion-header .arrow.open {
            transform: rotate(180deg);
        }
        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.3s ease;
            padding: 0 20px;
            background: #fff;
            border-radius: 0 0 28px 28px;
        }
        .accordion-body.open {
            max-height: 350px;
            padding: 12px 20px 20px;
        }
        /* 放大百科正文字体与间距 */
        .accordion-body p {
            font-size: clamp(1.05rem, 1.2vw, 1.25rem);
            line-height: 1.7;
            color: #2a4050;
            margin: 8px 0;
        }
        .accordion-body strong {
            color: #1a4d7a;
        }

        @media (max-width: 820px) {
            .container {
                flex-wrap: wrap;
                height: auto;
                max-height: none;
                overflow-y: auto;
                border-radius: 28px;
                padding: 12px;
                gap: 10px;
            }
            html,
            body {
                overflow: auto;
            }
            .left-panel {
                width: 100%;
                height: 52px;
                flex-direction: row;
                padding: 0 12px;
                border-radius: 24px;
            }
            .vertical-title {
                writing-mode: horizontal-tb;
                letter-spacing: 6px;
                font-size: 1.4rem;
                gap: 4px;
            }
            .center-panel {
                flex: 1 1 100%;
                padding: 4px 0;
                height: auto;
            }
            .thermo-area {
                max-height: 500px;
                padding: 10px 12px;
            }
            .thermometer-wrapper {
                height: 70%;
            }
            .right-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }
            .ctrl-group {
                flex: 1;
                min-width: 160px;
                padding: 12px 12px;
            }
            .accordion {
                flex: 1;
                min-width: 160px;
            }
            .current-temp {
                font-size: 1.8rem;
                margin-top: 6px;
                padding: 4px 14px;
            }
            .magnifier-overlay {
                right: -15%;
                width: 30%;
                min-width: 140px;
                aspect-ratio: 0.6;
            }
            .bulb {
                width: 70%;
                max-width: 34px;
            }
        }
        @media (max-width: 500px) {
            .thermometer-wrapper {
                height: 60%;
            }
            .right-scale {
                min-width: 32px;
            }
            .thermometer {
                min-width: 30px;
            }
            .scale-value {
                font-size: 12px;
                left: 12px;
            }
            .scale-line {
                width: 6px;
            }
            .scale-line.major {
                width: 10px;
            }
            .magnifier-overlay {
                right: -10%;
                width: 35%;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="left-panel">
            <div class="vertical-title" id="mainTitle">
                <span class="emoji">🌡️</span>
                <span>气</span>
                <span>温</span>
                <span>计</span>
                <span>实</span>
                <span>验</span>
                <span>室</span>
            </div>
        </div>

        <div class="center-panel" id="centerPanel">
            <div class="thermo-area">
                <div class="thermometer-wrapper">
                    <div class="thermometer" id="thermometer">
                        <div class="mercury" id="mercuryFill">
                            <div class="mercury-top" id="mercuryTop"></div>
                        </div>
                        <div class="bulb"></div>
                    </div>
                    <div class="right-scale" id="scaleContainer"></div>

                    <div class="magnifier-overlay" id="magnifierOverlay">
                        <div class="mag-close" id="magClose">✕</div>
                        <div class="mag-title">🔍 液面放大</div>
                        <div class="mag-scale-wrap" id="magScaleWrap">
                            <!-- 指示器和刻度会动态添加 -->
                        </div>
                    </div>
                </div>
                <div class="current-temp" id="tempDisplay">-- °C</div>
            </div>
        </div>

        <div class="right-panel">

            <div class="ctrl-group">
                <button id="randomBtn">🎲 随机温度</button>
                <button id="revealBtn" class="icon-btn">🔎 显示答案</button>
                <button id="magnifyBtn" class="icon-btn">🔍 放大液面</button>

                <div class="scale-switch">
                    <button class="scale-btn" data-scale="2">2°C</button>
                    <button class="scale-btn active-btn" data-scale="1">1°C</button>
                </div>
                <div class="scale-hint" id="scaleHint">✅ 分度值：1°C（精细）</div>
            </div>

            <div class="accordion">
                <button class="accordion-header" id="accordionToggle">
                    <span>📖 小百科</span>
                    <span class="arrow" id="arrowIcon">▼</span>
                </button>
                <div class="accordion-body" id="accordionBody">
                    <p><strong>℃ 摄氏度</strong> — 水结冰 0°C，沸腾 100°C。</p>
                    <p><strong>测量范围</strong> -30°C ~ 50°C，适合天气观察。</p>
                    <p><strong>读数方法</strong> 视线平视，以<strong>凹面最低处</strong>为准读数。</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const mercuryFill = document.getElementById('mercuryFill');
            const mercuryTop = document.getElementById('mercuryTop');
            const tempDisplay = document.getElementById('tempDisplay');
            const scaleContainer = document.getElementById('scaleContainer');
            const magnifierOverlay = document.getElementById('magnifierOverlay');
            const magScaleWrap = document.getElementById('magScaleWrap');
            const magClose = document.getElementById('magClose');

            let rawTemp = null;          
            let displayTemp = null;      
            let scaleValue = 1;
            let isTempHidden = true;
            let isMagnifierOpen = false;

            const DISPLAY_MIN = -30;
            const DISPLAY_MAX = 50;
            const OFFSET = 7;            

            const RAW_MIN = DISPLAY_MIN + OFFSET; 
            const RAW_MAX = DISPLAY_MAX + OFFSET; 
            const TOTAL_RAW_RANGE = RAW_MAX - RAW_MIN;

            function getThermoHeight() {
                const thermo = document.getElementById('thermometer');
                return thermo ? thermo.clientHeight : 500;
            }

            function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

            function getMercuryPercent(raw) {
                return clamp(((raw - RAW_MIN) / TOTAL_RAW_RANGE) * 100, 0, 100);
            }

            function updateUI(showRealTemp) {
                if (rawTemp === null) return;
                const pct = getMercuryPercent(rawTemp);
                
                mercuryFill.style.height = pct + '%';
                
                if (pct > 2) {
                    mercuryTop.classList.add('show');
                } else {
                    mercuryTop.classList.remove('show');
                }
                if (showRealTemp) {
                    displayTemp = rawTemp - OFFSET;
                    tempDisplay.textContent = displayTemp + ' °C';
                } else {
                    tempDisplay.textContent = '-- °C';
                }
                if (isMagnifierOpen) updateMagnifier();
            }

            function generateRandomTemp() {
                let newDisplay;
                if (scaleValue === 1) {
                    newDisplay = Math.floor(Math.random() * (DISPLAY_MAX - DISPLAY_MIN + 1)) + DISPLAY_MIN;
                } else {
                    let minEven = Math.ceil(DISPLAY_MIN / 2) * 2;
                    let maxEven = Math.floor(DISPLAY_MAX / 2) * 2;
                    let steps = (maxEven - minEven) / 2;
                    let randStep = Math.floor(Math.random() * (steps + 1));
                    newDisplay = minEven + randStep * 2;
                }
                newDisplay = clamp(newDisplay, DISPLAY_MIN, DISPLAY_MAX);
                rawTemp = newDisplay + OFFSET;
                isTempHidden = true;
                if (isMagnifierOpen) toggleMagnifier(false);
                updateUI(false);
            }

            function rebuildScale() {
                scaleContainer.innerHTML = '';
                const step = scaleValue;
                const h = getThermoHeight();
                for (let displayVal = DISPLAY_MIN; displayVal <= DISPLAY_MAX; displayVal += step) {
                    const raw = displayVal + OFFSET;
                    const ratio = (raw - RAW_MIN) / TOTAL_RAW_RANGE;
                    const topPos = h - (ratio * h);
                    const line = document.createElement('div');
                    if (displayVal % 10 === 0) {
                        line.className = 'scale-line major';
                        const label = document.createElement('div');
                        label.className = 'scale-value';
                        label.textContent = displayVal + '°C';
                        label.style.top = topPos + 'px';
                        scaleContainer.appendChild(label);
                    } else if (scaleValue === 1 && displayVal % 5 === 0) {
                        line.className = 'scale-line medium';
                    } else {
                        line.className = 'scale-line minor';
                    }
                    line.style.top = topPos + 'px';
                    scaleContainer.appendChild(line);
                }
            }

            function setScaleValue(newScale) {
                if (scaleValue === newScale) return;
                scaleValue = newScale;
                if (rawTemp !== null) {
                    let displayVal = rawTemp - OFFSET;
                    if (newScale === 2 && displayVal % 2 !== 0) {
                        displayVal = displayVal + (displayVal > 0 ? 1 : -1);
                        displayVal = clamp(displayVal, DISPLAY_MIN, DISPLAY_MAX);
                        rawTemp = displayVal + OFFSET;
                    }
                }
                rebuildScale();
                document.querySelectorAll('.scale-btn').forEach(b => {
                    b.classList.toggle('active-btn', parseInt(b.dataset.scale) === newScale);
                });
                const hint = document.getElementById('scaleHint');
                hint.innerHTML = (newScale === 1) ?
                    '✅ 分度值：<strong>1°C</strong>（精细读数）' :
                    '✅ 分度值：<strong>2°C</strong>（快速估算）';
                if (isMagnifierOpen) toggleMagnifier(false);
                updateUI(!isTempHidden);
            }

            function revealTemperature() {
                if (rawTemp !== null) {
                    isTempHidden = false;
                    updateUI(true);
                }
            }

            function toggleMagnifier(show) {
                if (show === undefined) show = !isMagnifierOpen;
                if (show && rawTemp === null) return;
                isMagnifierOpen = show;
                magnifierOverlay.classList.toggle('visible', show);
                if (show) {
                    requestAnimationFrame(() => updateMagnifier());
                }
            }

            function updateMagnifier() {
                if (!isMagnifierOpen || rawTemp === null) return;
                const wrap = magScaleWrap;
                wrap.innerHTML = '';
                const displayVal = rawTemp - OFFSET;

                let magMinDisplay = Math.floor((displayVal - 8) / 10) * 10;
                let magMaxDisplay = Math.ceil((displayVal + 8) / 10) * 10;
                if (magMaxDisplay - magMinDisplay < 15) {
                    const center = Math.round(displayVal / 10) * 10;
                    magMinDisplay = center - 10;
                    magMaxDisplay = center + 10;
                }
                magMinDisplay = Math.max(DISPLAY_MIN, magMinDisplay);
                magMaxDisplay = Math.min(DISPLAY_MAX, magMaxDisplay);

                const step = scaleValue;
                const magMinRaw = magMinDisplay + OFFSET;
                const magMaxRaw = magMaxDisplay + OFFSET;
                const range = magMaxRaw - magMinRaw;
                if (range <= 0) return;

                for (let raw = magMinRaw; raw <= magMaxRaw; raw += step) {
                    const ratio = (raw - magMinRaw) / range;
                    const topPos = (1 - ratio) * 100;
                    const line = document.createElement('div');
                    const displayValLine = raw - OFFSET;
                    if (displayValLine % 10 === 0) {
                        line.className = 'mag-line major';
                        const label = document.createElement('div');
                        label.className = 'mag-label';
                        label.textContent = displayValLine;
                        label.style.top = topPos + '%';
                        wrap.appendChild(label);
                    } else if (step === 1 && displayValLine % 5 === 0) {
                        line.className = 'mag-line medium';
                    } else {
                        line.className = 'mag-line minor';
                    }
                    line.style.top = topPos + '%';
                    wrap.appendChild(line);
                }

                const indRatio = (rawTemp - magMinRaw) / range;
                const indTop = (1 - indRatio) * 100;

                const magLiquid = document.createElement('div');
                magLiquid.className = 'mag-liquid';
                magLiquid.style.top = indTop + '%';
                magLiquid.style.bottom = '0';
                wrap.appendChild(magLiquid);

                const magMeniscus = document.createElement('div');
                magMeniscus.className = 'mag-meniscus';
                magMeniscus.style.top = indTop + '%';
                wrap.appendChild(magMeniscus);

                // 只保留纯净的红色辅助虚线，无任何文字遮挡
                const magIndicatorLine = document.createElement('div');
                magIndicatorLine.className = 'mag-indicator-line';
                magIndicatorLine.style.top = indTop + '%';
                wrap.appendChild(magIndicatorLine);
            }

            function newRandomTemperature() {
                generateRandomTemp();
                isTempHidden = true;
                if (isMagnifierOpen) toggleMagnifier(false);
                updateUI(false);
            }

            function handleResize() {
                rebuildScale();
                if (isMagnifierOpen) updateMagnifier();
            }

            function init() {
                scaleValue = 1;
                requestAnimationFrame(() => {
                    rebuildScale();
                    generateRandomTemp();
                    document.querySelectorAll('.scale-btn').forEach(b => {
                        b.classList.toggle('active-btn', parseInt(b.dataset.scale) === 1);
                    });
                });

                document.getElementById('randomBtn').addEventListener('click', newRandomTemperature);
                document.getElementById('revealBtn').addEventListener('click', revealTemperature);
                document.getElementById('magnifyBtn').addEventListener('click', function() {
                    toggleMagnifier();
                });
                magClose.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleMagnifier(false);
                });

                document.querySelectorAll('.scale-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const val = parseInt(this.dataset.scale);
                        if (isNaN(val)) return;
                        setScaleValue(val);
                    });
                });

                const accordionToggle = document.getElementById('accordionToggle');
                const accordionBody = document.getElementById('accordionBody');
                const arrowIcon = document.getElementById('arrowIcon');
                let isAccordionOpen = false;
                accordionToggle.addEventListener('click', function() {
                    isAccordionOpen = !isAccordionOpen;
                    accordionBody.classList.toggle('open', isAccordionOpen);
                    arrowIcon.classList.toggle('open', isAccordionOpen);
                });

                document.addEventListener('click', function(e) {
                    if (isMagnifierOpen) {
                        const target = e.target;
                        if (!magnifierOverlay.contains(target) &&
                            target.id !== 'magnifyBtn' &&
                            !target.closest('#magnifyBtn')) {
                            toggleMagnifier(false);
                        }
                    }
                });

                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(handleResize, 150);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

  <div class="inner">© 2026 开物AI科学 ｜ AI 赋能 · 教育公平</div>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("mainTitle") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
