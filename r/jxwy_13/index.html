<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水和金属的冷热实验</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --hot-color: #ef4444;
            --cold-color: #06b6d4;
            --normal-color: #8b5cf6;
            --accent-color: #f97316;
            --success-color: #10b981;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 100%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }
        .header {
            flex: 0 0 auto;
            padding: 1rem 2rem;
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .header h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 0.3rem;
        }
        .header p {
            font-size: 1.1rem;
            color: var(--text-dim);
        }
        .main-content {
            flex: 1;
            display: flex;
            padding: 1rem;
            gap: 1rem;
            min-height: 0;
        }
        .exp-panel {
            flex: 1;
            background: var(--card-bg);
            border-radius: 1.2rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 2px solid var(--border-color);
            position: relative;
        }
        .exp-title {
            font-size: 1.4rem;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            border-radius: 0.8rem;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }
        .canvas-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .result-box {
            flex-shrink: 0;
            height: 70px;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: #f1f5f9;
            border-left: 5px solid var(--primary-color);
            color: var(--text-main);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .result-box.show {
            display: flex;
        }
        .result-box.hot {
            background: #fef2f2;
            border-left-color: var(--hot-color);
            color: var(--hot-color);
        }
        .result-box.cold {
            background: #ecfeff;
            border-left-color: var(--cold-color);
            color: var(--cold-color);
        }
        .result-box.success {
            background: #ecfdf5;
            border-left-color: var(--success-color);
            color: #065f46;
        }
        .footer-controls {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .ctrl-group {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex: 1;
            justify-content: center;
            flex-wrap: wrap;
        }
        .ctrl-divider {
            width: 1px;
            height: 40px;
            background: var(--border-color);
            margin: 0 0.5rem;
        }
        .btn {
            padding: 0.8rem 1.2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-hot {
            background: var(--hot-color);
            color: white;
        }
        .btn-cold {
            background: var(--cold-color);
            color: white;
        }
        .btn-normal {
            background: var(--normal-color);
            color: white;
        }
        .btn-accent {
            background: var(--accent-color);
            color: white;
        }
        .btn-secondary {
            background: #475569;
            color: white;
        }
        .btn-explain {
            background: #f1f5f9;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }
        .btn-explain:hover {
            background: #e0e7ff;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 800px) {
            .header h1 {
                font-size: 1.2rem;
            }
            .main-content {
                flex-direction: column;
                padding: 0.5rem;
                gap: 0.5rem;
            }
            .exp-panel {
                padding: 0.5rem;
            }
            .exp-title {
                font-size: 1rem;
            }
            .footer-controls {
                padding: 0.5rem;
                flex-direction: column;
                gap: 0.3rem;
            }
            .ctrl-divider {
                display: none;
            }
            .ctrl-group {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.3rem;
            }
            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
            .result-box {
                height: 50px;
                font-size: 0.9rem;
                padding: 0.5rem;
                margin-top: 0.5rem;
            }
        }
        @media (max-width: 480px) {
            .btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.75rem;
            }
            .header h1 {
                font-size: 1rem;
            }
            .exp-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="mainTitle">🔬 拓展探究：水和金属的冷热变化</h1>
        <!-- 副标题已删除 -->
    </header>

    <main class="main-content">
        <section class="exp-panel">
            <div class="exp-title">💧 实验一：液体的热胀冷缩</div>
            <div class="canvas-container"><canvas id="waterCanvas"></canvas></div>
            <div class="result-box" id="waterResult"></div>
        </section>
        <section class="exp-panel">
            <div class="exp-title">⚙️ 实验二：固体的热胀冷缩</div>
            <div class="canvas-container"><canvas id="copperCanvas"></canvas></div>
            <div class="result-box" id="copperResult"></div>
        </section>
    </main>

    <footer class="footer-controls">
        <div class="ctrl-group">
            <button class="btn btn-hot" onclick="runWaterExp('hot')">🔥 放入热水</button>
            <button class="btn btn-normal" onclick="runWaterExp('normal')">💧 常温水</button>
            <button class="btn btn-cold" onclick="runWaterExp('cold')">❄️ 放入冰水</button>
            <button class="btn btn-explain" onclick="toggleExplanation('water')">💡 现象解释</button>
        </div>
        <div class="ctrl-divider"></div>
        <button class="btn btn-secondary" onclick="resetAll()">🔄 重置实验</button>
        <div class="ctrl-divider"></div>
        <div class="ctrl-group">
            <button class="btn btn-primary" onclick="setNormal()">🌡️ 常温</button>
            <button class="btn btn-cold" onclick="setFrozen()">❄️ 冷冻铜环</button>
            <button class="btn btn-hot" onclick="setHeated()">🔥 加热铜球</button>
            <button class="btn btn-accent" onclick="dropBall()" id="dropBallBtn">⬇️ 落球</button>
            <button class="btn btn-explain" onclick="toggleExplanation('copper')">💡 现象解释</button>
        </div>
    </footer>

    <script>
        // ====== 工具函数 ======
        function checkCanvasSize(canvas) {
            var rect = canvas.getBoundingClientRect();
            var dpr = window.devicePixelRatio || 1;
            var needW = Math.round(rect.width * dpr);
            var needH = Math.round(rect.height * dpr);
            if (needW > 0 && needH > 0 && (canvas.width !== needW || canvas.height !== needH)) {
                canvas.width = needW;
                canvas.height = needH;
                var ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            return { w: rect.width, h: rect.height };
        }

        function toggleExplanation(type) {
            var el = document.getElementById(type + 'Result');
            el.classList.toggle('show');
            if (!el.classList.contains('show')) return;
            var text = '',
                cls = 'result-box show ';
            if (type === 'water') {
                if (waterState.tempType === 'hot') {
                    text = "🔥 现象解释：放入热水中，红色液柱缓慢上升。说明水受热后体积膨胀了。";
                    cls += 'hot';
                } else if (waterState.tempType === 'cold') {
                    text = "❄️ 现象解释：放入冰水中，红色液柱缓慢下降。说明水遇冷后体积收缩了。";
                    cls += 'cold';
                } else {
                    text = "💧 现象解释：放入常温水中，红色液柱几乎不变。说明常温下水体积稳定。";
                }
            } else {
                if (copperState.tempState === 'frozen' || copperState.tempState === 'frozen_done') {
                    if (copperState.ballStuck) {
                        text = "🛑 现象解释：铜环冷冻后遇冷收缩，孔径变小，铜球卡死在铜环内无法穿过！";
                    } else {
                        text = "❄️ 现象解释：铜环被冷冻，遇冷后固体体积收缩，孔径变小（铜球保持不变）。";
                    }
                    cls += 'cold';
                } else if (copperState.tempState === 'heated' || copperState.tempState === 'heated_done') {
                    if (copperState.ballStuck) {
                        text = "🛑 现象解释：铜球受热膨胀，体积变大，比铜环孔径大了，所以无法穿过铜环！";
                    } else if (copperState.tempState === 'heated') {
                        text = "🔥 现象解释：铜球正在被加热，受热后固体体积逐渐膨胀（铜环保持不变），加热完成后点击落球观察。";
                    } else {
                        text = "🔥 现象解释：铜球已被加热，体积膨胀变大（铜环保持不变），点击落球观察它能否穿过铜环。";
                    }
                    cls += 'hot';
                } else {
                    if (copperState.ballPassed) {
                        text = "✅ 现象解释：常温下铜球顺利穿过铜环，说明常温时铜环孔径足够大。";
                        cls += 'success';
                    } else {
                        text = "💧 现象解释：常温下的铜球和铜环，点击落球可观察铜球是否能穿过。";
                        cls += 'success';
                    }
                }
            }
            el.textContent = text;
            el.className = cls;
        }

        // ====== 实验1：液体热胀冷缩 ======
        var waterState = {
            tempType: 'none',
            waterLevel: 60,
            targetLevel: 60,
            startLevel: 60,
            changing: false,
            progress: 0,
            iceBlocks: [],
            hotBubbles: [],
            coldAir: [],
            snow: []
        };

        function drawWaterExp() {
            var wCanvas = document.getElementById('waterCanvas');
            if (!wCanvas) return;
            var dim = checkCanvasSize(wCanvas);
            var ctx = wCanvas.getContext('2d');
            var w = dim.w,
                h = dim.h;
            if (w < 10 || h < 10) return;
            ctx.clearRect(0, 0, w, h);
            var showResult = document.getElementById('waterResult').classList.contains('show');
            var offset = showResult ? 40 : 0;
            var cx = w / 2;
            var baseY = h - 40 - offset;

            if (waterState.tempType !== 'none') {
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(cx - 140, baseY - 180);
                ctx.lineTo(cx - 140, baseY);
                ctx.lineTo(cx + 140, baseY);
                ctx.lineTo(cx + 140, baseY - 180);
                ctx.stroke();
                var ec1, ec2;
                if (waterState.tempType === 'hot') { ec1 = 'rgba(254,226,226,0.8)';
                    ec2 = 'rgba(239,68,68,0.4)'; } else if (waterState.tempType === 'cold') { ec1 =
                        'rgba(207,250,254,0.8)';
                    ec2 = 'rgba(6,182,212,0.5)'; } else { ec1 = 'rgba(243,244,246,0.8)';
                    ec2 = 'rgba(156,163,175,0.4)'; }
                var envGrad = ctx.createLinearGradient(0, baseY - 160, 0, baseY);
                envGrad.addColorStop(0, ec1);
                envGrad.addColorStop(1, ec2);
                ctx.fillStyle = envGrad;
                ctx.fillRect(cx - 138, baseY - 160, 276, 158);
                if (waterState.tempType === 'hot') {
                    if (Math.random() < 0.25) waterState.hotBubbles.push({ x: cx - 120 + Math.random() * 240, y: baseY - 8,
                        r: 2 + Math.random() * 4, vy: 0.6 + Math.random() * 0.8, sway: Math.random() * Math.PI * 2 });
                    for (var i = waterState.hotBubbles.length - 1; i >= 0; i--) {
                        var b = waterState.hotBubbles[i];
                        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.stroke();
                        b.y -= b.vy;
                        b.vy *= 1.01;
                        b.x += Math.sin(Date.now() / 300 + b.sway) * 0.4;
                        b.r *= 1.003;
                        if (b.y < baseY - 160) waterState.hotBubbles.splice(i, 1);
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    for (var i2 = 0; i2 < 3; i2++) {
                        ctx.beginPath();
                        ctx.ellipse(cx + (i2 - 1) * 40, baseY - 190 - Math.sin(Date.now() / 500 + i2) * 10, 15, 25, 0, 0,
                            Math.PI * 2);
                        ctx.fill();
                    }
                }
                if (waterState.tempType === 'cold') {
                    if (waterState.iceBlocks.length < 5 && Math.random() < 0.05) waterState.iceBlocks.push({ x: cx - 100 +
                            Math.random() * 200, y: baseY - 160, rot: Math.random() * Math.PI, vy: 0.3 });
                    for (var i3 = waterState.iceBlocks.length - 1; i3 >= 0; i3--) {
                        var ice = waterState.iceBlocks[i3];
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.save();
                        ctx.translate(ice.x, ice.y);
                        ctx.rotate(ice.rot);
                        ctx.fillRect(-12, -12, 24, 24);
                        ctx.restore();
                        ice.y += ice.vy;
                        if (ice.y > baseY - 20) ice.vy = -ice.vy;
                        if (ice.y < baseY - 160) ice.vy = -ice.vy;
                    }
                    if (waterState.snow.length < 20 && Math.random() < 0.3) {
                        waterState.snow.push({ x: cx - 135 + Math.random() * 270, y: baseY - 160, r: 1.5 + Math.random() *
                                2, vy: 0.4 + Math.random() * 0.6, sway: Math.random() * Math.PI * 2 });
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    for (var i6 = waterState.snow.length - 1; i6 >= 0; i6--) {
                        var s = waterState.snow[i6];
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                        s.y += s.vy;
                        s.x += Math.sin(Date.now() / 400 + s.sway) * 0.5;
                        if (s.y > baseY) waterState.snow.splice(i6, 1);
                    }
                    if (Math.random() < 0.2) waterState.coldAir.push({ x: cx + (Math.random() - 0.5) * 250, y: baseY -
                            160, r: 4, alpha: 0.6 });
                    for (var i4 = waterState.coldAir.length - 1; i4 >= 0; i4--) {
                        var p = waterState.coldAir[i4];
                        ctx.fillStyle = 'rgba(255,255,255,' + p.alpha + ')';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                        p.y -= 0.5;
                        p.alpha -= 0.005;
                        if (p.alpha <= 0) waterState.coldAir.splice(i4, 1);
                    }
                }
            }

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.ellipse(cx, baseY - 50, 55, 45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - 15, baseY - 80);
            ctx.lineTo(cx - 15, baseY - 170);
            ctx.lineTo(cx + 15, baseY - 170);
            ctx.lineTo(cx + 15, baseY - 80);
            ctx.stroke();

            var flaskGrad = ctx.createLinearGradient(0, baseY - 95, 0, baseY - 10);
            flaskGrad.addColorStop(0, 'rgba(248,113,113,0.75)');
            flaskGrad.addColorStop(1, 'rgba(185,28,28,0.85)');
            ctx.fillStyle = flaskGrad;
            ctx.beginPath();
            ctx.ellipse(cx, baseY - 50, 52, 42, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(cx - 13, baseY - 170, 26, 90);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(cx - 18, baseY - 62, 14, 7, -0.4, 0, Math.PI * 2);
            ctx.fill();

            var tubeW = 6;
            ctx.beginPath();
            ctx.moveTo(cx - tubeW / 2, baseY - 170);
            ctx.lineTo(cx - tubeW / 2, baseY - 290);
            ctx.lineTo(cx + tubeW / 2, baseY - 290);
            ctx.lineTo(cx + tubeW / 2, baseY - 170);
            ctx.stroke();

            if (waterState.changing) {
                waterState.progress += 1 / 600;
                if (waterState.progress >= 1) { waterState.progress = 1;
                    waterState.changing = false; }
                var t = waterState.progress;
                var eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                waterState.waterLevel = waterState.startLevel + (waterState.targetLevel - waterState.startLevel) * eased;
            }
            var tubeBottom = baseY - 170;
            var liquidH = waterState.waterLevel;
            var liquidTop = tubeBottom - liquidH;
            ctx.fillStyle = 'rgba(239,68,68,0.9)';
            ctx.fillRect(cx - tubeW / 2 + 1, liquidTop, tubeW - 2, liquidH);
            ctx.beginPath();
            ctx.ellipse(cx, liquidTop, tubeW / 2 - 1, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#94a3b8';
            ctx.fillStyle = '#64748b';
            ctx.font = '10px Arial';
            for (var i5 = 0; i5 <= 8; i5++) {
                var y = tubeBottom - i5 * 15;
                ctx.beginPath();
                ctx.moveTo(cx + tubeW / 2, y);
                ctx.lineTo(cx + tubeW / 2 + 5, y);
                ctx.stroke();
                if (i5 % 2 === 0) ctx.fillText(String(i5 * 10), cx + tubeW / 2 + 8, y + 3);
            }
        }

        function runWaterExp(type) {
            waterState.tempType = type;
            waterState.startLevel = waterState.waterLevel;
            if (type === 'hot') waterState.targetLevel = 110;
            else if (type === 'cold') waterState.targetLevel = 30;
            else waterState.targetLevel = 60;
            waterState.changing = true;
            waterState.progress = 0;
            waterState.snow = [];
            document.getElementById('waterResult').classList.remove('show');
        }

        // ====== 实验2：固体热胀冷缩 ======
        var BALL_R = 77.25;
        var BALL_R_HEATED = 92;
        var N_RX_OUT = 97.5,
            N_RY_OUT = 82.5,
            N_RX_IN = 75,
            N_RY_IN = 60;
        var F_RX_OUT = 90,
            F_RY_OUT = 75,
            F_RX_IN = 72,
            F_RY_IN = 57;
        var DROP_GAP = 30;

        var copperState = {
            tempState: 'normal', // 'normal' | 'frozen' | 'frozen_done' | 'heated' | 'heated_done'
            ballY: 0,
            ballVY: 0,
            ballVisible: true,
            ballPassed: false,
            ballStuck: false,
            ballR: BALL_R,
            tarBallR: BALL_R,
            rxOut: N_RX_OUT,
            ryOut: N_RY_OUT,
            rxIn: N_RX_IN,
            ryIn: N_RY_IN,
            tarRxOut: N_RX_OUT,
            tarRyOut: N_RY_OUT,
            tarRxIn: N_RX_IN,
            tarRyIn: N_RY_IN,
            shake: 0,
            shakeT: 0,
            fade: 1,
            freezeBgVisible: false,
            freezeTimer: 0,
            flames: [],
            snowflakes: [],
            wobble: 0,
            heatingTimeout: null,
            freezingTimeout: null
        };

        function drawCopperExp() {
            var cCanvas = document.getElementById('copperCanvas');
            if (!cCanvas) return;
            var dim = checkCanvasSize(cCanvas);
            var ctx = cCanvas.getContext('2d');
            var w = dim.w,
                h = dim.h;
            if (w < 10 || h < 10) return;
            ctx.clearRect(0, 0, w, h);

            var showResult = document.getElementById('copperResult').classList.contains('show');
            var offset = showResult ? 40 : 0;
            var cx = w / 2;
            var ringY = h - 140 - offset;
            var time = Date.now() / 1000;

            // 状态标签
            var isFreezing = copperState.tempState === 'frozen';
            var isFrozenDone = copperState.tempState === 'frozen_done';
            var isHeating = copperState.tempState === 'heated';
            var isHeatedDone = copperState.tempState === 'heated_done';
            var isFrozenState = isFreezing || isFrozenDone;
            var isHeatedState = isHeating || isHeatedDone;

            var badgeText = isFreezing ? '❄️ 冷冻铜环中...' :
                isFrozenDone ? '❄️ 已冷冻（收缩）' :
                isHeating ? '🔥 加热铜球中...' :
                isHeatedDone ? '🔥 已加热（膨胀）' :
                '🌡️ 常温';
            var badgeColor = isFreezing ? 'rgba(6,182,212,0.20)' :
                isFrozenDone ? 'rgba(6,182,212,0.12)' :
                isHeating ? 'rgba(239,68,68,0.20)' :
                isHeatedDone ? 'rgba(239,68,68,0.12)' :
                'rgba(139,92,246,0.12)';
            var badgeBorder = isFreezing ? '#06b6d4' :
                isFrozenDone ? '#0e7490' :
                isHeating ? '#ef4444' :
                isHeatedDone ? '#b91c1c' :
                '#8b5cf6';
            ctx.font = 'bold 16px "PingFang SC", "Microsoft YaHei", sans-serif';
            var tw = ctx.measureText(badgeText).width;
            ctx.fillStyle = badgeColor;
            ctx.strokeStyle = badgeBorder;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            var rx = 12,
                ry = 12,
                rw = tw + 24,
                rh = 32,
                rad = 16;
            ctx.moveTo(rx + rad, ry);
            ctx.lineTo(rx + rw - rad, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rad);
            ctx.lineTo(rx + rw, ry + rh - rad);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rad, ry + rh);
            ctx.lineTo(rx + rad, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rad);
            ctx.lineTo(rx, ry + rad);
            ctx.quadraticCurveTo(rx, ry, rx + rad, ry);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = badgeBorder;
            ctx.fillText(badgeText, 24, 34);

            // 摇摆
            ctx.save();
            var pivotX = cx,
                pivotY = ringY - 160;
            if (copperState.shake > 0) {
                copperState.shakeT += 0.35;
                copperState.wobble = Math.sin(copperState.shakeT * 3) * copperState.shake * 0.012;
                copperState.shake -= 0.15;
            } else {
                copperState.wobble *= 0.9;
            }
            ctx.translate(pivotX, pivotY);
            ctx.rotate(copperState.wobble);
            ctx.translate(-pivotX, -pivotY);

            // 底座
            var baseGrad = ctx.createLinearGradient(0, ringY + 100, 0, ringY + 112);
            baseGrad.addColorStop(0, '#f1f5f9');
            baseGrad.addColorStop(1, '#cbd5e1');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(cx - 150, ringY + 100, 300, 12);

            // 尺寸平滑过渡
            copperState.rxOut += (copperState.tarRxOut - copperState.rxOut) * 0.05;
            copperState.ryOut += (copperState.tarRyOut - copperState.ryOut) * 0.05;
            copperState.rxIn += (copperState.tarRxIn - copperState.rxIn) * 0.05;
            copperState.ryIn += (copperState.tarRyIn - copperState.ryIn) * 0.05;
            copperState.ballR += (copperState.tarBallR - copperState.ballR) * 0.05;

            // 冷冻冰块背景
            if (isFreezing && copperState.freezeBgVisible) {
                var margin = 37;
                var iceL = cx - N_RX_OUT - margin,
                    iceR = cx + N_RX_OUT + margin;
                var iceT = ringY - N_RY_OUT - margin,
                    iceB = ringY + N_RY_OUT + margin + 45;
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(iceL, iceT);
                ctx.lineTo(iceL, iceB);
                ctx.lineTo(iceR, iceB);
                ctx.lineTo(iceR, iceT);
                ctx.stroke();
                var iceBoxGrad = ctx.createLinearGradient(iceL, iceT, iceR, iceB);
                iceBoxGrad.addColorStop(0, 'rgba(207,250,254,0.55)');
                iceBoxGrad.addColorStop(0.5, 'rgba(224,242,254,0.75)');
                iceBoxGrad.addColorStop(1, 'rgba(165,243,252,0.55)');
                ctx.fillStyle = iceBoxGrad;
                ctx.fillRect(iceL + 3, iceT + 3, iceR - iceL - 6, iceB - iceT - 6);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                for (var i = 0; i < 5; i++) {
                    ctx.save();
                    ctx.translate(cx - 75 + i * 37, ringY + 45 + Math.sin(Date.now() / 500 + i) * 7);
                    ctx.rotate(i * 0.5);
                    ctx.fillRect(-12, -12, 24, 24);
                    ctx.restore();
                }
                copperState.freezeTimer++;
                if (copperState.freezeTimer > 180) {
                    copperState.freezeBgVisible = false;
                }
            }

            // 冷冻飘雪
            if (isFreezing) {
                if (copperState.snowflakes.length < 25 && Math.random() < 0.35) {
                    copperState.snowflakes.push({
                        x: cx - 160 + Math.random() * 320,
                        y: ringY - 200 - Math.random() * 40,
                        r: 2 + Math.random() * 2.5,
                        vy: 0.8 + Math.random() * 1.2,
                        sway: Math.random() * Math.PI * 2,
                        alpha: 0.5 + Math.random() * 0.5
                    });
                }
                for (var si = copperState.snowflakes.length - 1; si >= 0; si--) {
                    var sf = copperState.snowflakes[si];
                    ctx.fillStyle = 'rgba(255,255,255,' + sf.alpha + ')';
                    ctx.beginPath();
                    ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI * 2);
                    ctx.fill();
                    sf.y += sf.vy;
                    sf.x += Math.sin(Date.now() / 400 + sf.sway) * 0.6;
                    if (sf.y > ringY + 130) copperState.snowflakes.splice(si, 1);
                }
            } else {
                if (copperState.snowflakes.length > 0) copperState.snowflakes = [];
            }

            var strokeW = 2 * (copperState.rxOut - copperState.rxIn);

            // 球位置
            var idleBob = (copperState.ballVY === 0 && !copperState.ballStuck) ? Math.sin(time * 2) * 5 : 0;
            var ballStartY = ringY - copperState.ryOut - copperState.ballR - DROP_GAP;
            var ballR = copperState.ballR;
            var ballY = ballStartY + copperState.ballY + idleBob;

            // 火焰粒子
            if (isHeating) {
                if (copperState.flames.length < 30 && Math.random() < 0.6) {
                    copperState.flames.push({
                        x: cx - ballR * 0.6 + Math.random() * ballR * 1.2,
                        y: ballY + ballR * 0.5,
                        r: 4 + Math.random() * 6,
                        vy: 1.5 + Math.random() * 2,
                        life: 1,
                        hue: 15 + Math.random() * 35
                    });
                }
                for (var fi = copperState.flames.length - 1; fi >= 0; fi--) {
                    var fl = copperState.flames[fi];
                    ctx.fillStyle = 'hsla(' + fl.hue + ', 95%, 55%, ' + (fl.life * 0.75) + ')';
                    ctx.beginPath();
                    ctx.arc(fl.x, fl.y, fl.r * fl.life, 0, Math.PI * 2);
                    ctx.fill();
                    fl.y -= fl.vy;
                    fl.x += Math.sin(Date.now() / 150 + fi) * 0.8;
                    fl.life -= 0.03;
                    if (fl.life <= 0) copperState.flames.splice(fi, 1);
                }
            } else {
                if (copperState.flames.length > 0) copperState.flames = [];
            }

            // 球在环后方时穿环渐隐
            ctx.save();
            ctx.globalAlpha = copperState.fade;

            // 地面投影
            if (copperState.ballVisible) {
                var shadowScale = 1 - Math.min((ballY - ballStartY) / 400, 0.3);
                ctx.fillStyle = 'rgba(0,0,0,' + (0.12 * copperState.fade) + ')';
                ctx.beginPath();
                ctx.ellipse(cx, ringY + 100, ballR * 0.7 * shadowScale, 10 * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 铜球
            if (copperState.ballVisible) {
                var pulse = isHeatedState ? 1 + Math.sin(Date.now() / 180) * 0.03 : 1;
                var drawR = ballR * pulse;

                var ballGrad = ctx.createRadialGradient(cx - drawR * 0.35, ballY - drawR * 0.4, drawR * 0.1, cx, ballY,
                drawR);
                if (isHeatedState) {
                    ballGrad.addColorStop(0, '#fca5a5');
                    ballGrad.addColorStop(0.4, '#ef4444');
                    ballGrad.addColorStop(0.8, '#b91c1c');
                    ballGrad.addColorStop(1, '#7f1d1d');
                } else {
                    ballGrad.addColorStop(0, '#fde68a');
                    ballGrad.addColorStop(0.35, '#f59e0b');
                    ballGrad.addColorStop(0.75, '#b45309');
                    ballGrad.addColorStop(1, '#78350f');
                }
                ctx.fillStyle = ballGrad;
                ctx.beginPath();
                ctx.arc(cx, ballY, drawR, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = isHeatedState ? '#7f1d1d' : '#78350f';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.beginPath();
                ctx.ellipse(cx - drawR * 0.38, ballY - drawR * 0.42, drawR * 0.18, drawR * 0.12, -0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.ellipse(cx + drawR * 0.3, ballY + drawR * 0.25, drawR * 0.1, drawR * 0.06, 0.5, 0, Math.PI * 2);
                ctx.fill();

                if (isHeatedState) {
                    var glowAlpha = isHeating ? (0.30 + 0.12 * Math.sin(Date.now() / 200)) : 0.18;
                    var glow = ctx.createRadialGradient(cx, ballY, drawR * 0.85, cx, ballY, drawR * 1.6);
                    glow.addColorStop(0, 'rgba(239,68,68,' + glowAlpha + ')');
                    glow.addColorStop(1, 'rgba(239,68,68,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(cx, ballY, drawR * 1.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (copperState.ballStuck) {
                    ctx.font = 'bold 30px Arial';
                    ctx.fillStyle = '#ef4444';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 4;
                    var exY = ballY - ballR - 18 + Math.sin(Date.now() / 200) * 3;
                    ctx.strokeText('❗', cx - 10, exY);
                    ctx.fillText('❗', cx - 10, exY);
                }
            }

            // 铜环
            var ringGrad = ctx.createLinearGradient(cx - copperState.rxOut, ringY - copperState.ryOut, cx + copperState
                .rxOut, ringY + copperState.ryOut);
            if (isFrozenState) {
                ringGrad.addColorStop(0, '#a5f3fc');
                ringGrad.addColorStop(0.5, '#22d3ee');
                ringGrad.addColorStop(1, '#0e7490');
            } else {
                ringGrad.addColorStop(0, '#fcd34d');
                ringGrad.addColorStop(0.5, '#d97706');
                ringGrad.addColorStop(1, '#92400e');
            }
            ctx.strokeStyle = ringGrad;
            ctx.lineWidth = strokeW;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.ellipse(cx, ringY, copperState.rxOut, copperState.ryOut, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 环上高光
            ctx.strokeStyle = isFrozenState ? 'rgba(255,255,255,0.85)' : 'rgba(251,191,36,0.6)';
            ctx.lineWidth = isFrozenState ? 7 : 4;
            ctx.beginPath();
            ctx.ellipse(cx, ringY - copperState.ryOut * 0.15,
                copperState.rxOut * 0.85, copperState.ryOut * 0.7,
                0, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();

            // 冷冻冰棱
            if (isFrozenState) {
                ctx.fillStyle = 'rgba(224,242,254,0.8)';
                for (var ic = 0; ic < 5; ic++) {
                    var icAngle = Math.PI * (0.25 + ic * 0.125);
                    var icX = cx + Math.cos(icAngle) * copperState.rxOut;
                    var icY = ringY + Math.sin(icAngle) * copperState.ryOut;
                    ctx.beginPath();
                    ctx.moveTo(icX - 4, icY);
                    ctx.lineTo(icX + 4, icY);
                    ctx.lineTo(icX, icY + 10 + (ic % 2) * 6);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.restore(); // fade
            ctx.restore(); // wobble

            // 落球物理
            if (copperState.ballVisible && copperState.ballVY !== 0) {
                copperState.ballVY += 0.3;
                if (copperState.ballVY > 8) copperState.ballVY = 8;
                copperState.ballY += copperState.ballVY;

                var newY = ballStartY + copperState.ballY;
                var newBottom = newY + ballR;

                if (copperState.tempState === 'normal') {
                    if (newBottom > ringY) {
                        copperState.fade -= 0.06;
                        if (copperState.fade <= 0) {
                            copperState.fade = 0;
                            copperState.ballVisible = false;
                            copperState.ballPassed = true;
                            copperState.ballStuck = false;
                            copperState.ballVY = 0;
                            copperState.ballY = 0;
                            setTimeout(function() {
                                copperState.ballVisible = true;
                                copperState.fade = 1;
                            }, 400);
                        }
                    }
                } else {
                    var stopLine = ringY + copperState.ryIn;
                    if (newBottom >= stopLine) {
                        copperState.ballY = stopLine - ballR - ballStartY;
                        copperState.ballVY = 0;
                        if (!copperState.ballStuck) copperState.shake = 10;
                        copperState.ballStuck = true;
                        copperState.ballPassed = false;
                    }
                }
            }
        }

        // ====== 控制函数 ======

        function clearHeatingTimer() {
            if (copperState.heatingTimeout) {
                clearTimeout(copperState.heatingTimeout);
                copperState.heatingTimeout = null;
            }
        }

        function clearFreezingTimer() {
            if (copperState.freezingTimeout) {
                clearTimeout(copperState.freezingTimeout);
                copperState.freezingTimeout = null;
            }
        }

        function finishHeating() {
            if (copperState.tempState === 'heated') {
                copperState.tempState = 'heated_done';
                copperState.flames = [];
                copperState.heatingTimeout = null;
                document.getElementById('copperResult').classList.remove('show');
            }
        }

        function finishFreezing() {
            if (copperState.tempState === 'frozen') {
                copperState.tempState = 'frozen_done';
                copperState.freezeBgVisible = false;
                copperState.snowflakes = [];
                copperState.freezingTimeout = null;
                document.getElementById('copperResult').classList.remove('show');
            }
        }

        function setNormal() {
            clearHeatingTimer();
            clearFreezingTimer();
            copperState.tempState = 'normal';
            copperState.tarRxOut = N_RX_OUT;
            copperState.tarRyOut = N_RY_OUT;
            copperState.tarRxIn = N_RX_IN;
            copperState.tarRyIn = N_RY_IN;
            copperState.tarBallR = BALL_R;
            copperState.freezeBgVisible = false;
            copperState.snowflakes = [];
            copperState.flames = [];
            if (copperState.ballStuck) {
                copperState.ballStuck = false;
                copperState.ballVY = 1;
            }
            document.getElementById('copperResult').classList.remove('show');
        }

        function setFrozen() {
            clearFreezingTimer();
            clearHeatingTimer();

            copperState.tempState = 'frozen';
            copperState.tarRxOut = F_RX_OUT;
            copperState.tarRyOut = F_RY_OUT;
            copperState.tarRxIn = F_RX_IN;
            copperState.tarRyIn = F_RY_IN;
            copperState.tarBallR = BALL_R;
            copperState.freezeBgVisible = true;
            copperState.freezeTimer = 0;
            copperState.flames = [];
            if (copperState.ballStuck) {
                copperState.ballStuck = false;
                copperState.ballY = 0;
                copperState.ballVY = 0;
            }
            document.getElementById('copperResult').classList.remove('show');

            copperState.freezingTimeout = setTimeout(function() {
                finishFreezing();
            }, 3000);
        }

        function setHeated() {
            clearHeatingTimer();
            clearFreezingTimer();

            copperState.tempState = 'heated';
            copperState.tarRxOut = N_RX_OUT;
            copperState.tarRyOut = N_RY_OUT;
            copperState.tarRxIn = N_RX_IN;
            copperState.tarRyIn = N_RY_IN;
            copperState.tarBallR = BALL_R_HEATED;
            copperState.freezeBgVisible = false;
            copperState.snowflakes = [];
            copperState.flames = [];

            if (copperState.ballStuck) {
                copperState.ballStuck = false;
                copperState.ballY = 0;
                copperState.ballVY = 0;
            }
            document.getElementById('copperResult').classList.remove('show');

            copperState.heatingTimeout = setTimeout(function() {
                finishHeating();
            }, 3000);
        }

        function dropBall() {
            if (copperState.tempState === 'heated' || copperState.tempState === 'frozen') {
                var resultEl = document.getElementById('copperResult');
                var msg = copperState.tempState === 'heated' ? '⏳ 铜球正在加热中，请等待加热完成！' :
                    '⏳ 铜环正在冷冻中，请等待冷冻完成！';
                resultEl.textContent = msg;
                resultEl.className = 'result-box show ' + (copperState.tempState === 'heated' ? 'hot' : 'cold');
                setTimeout(function() {
                    resultEl.classList.remove('show');
                }, 1800);
                return;
            }
            copperState.ballY = 0;
            copperState.ballVY = 0.5;
            copperState.ballPassed = false;
            copperState.ballStuck = false;
            copperState.ballVisible = true;
            copperState.fade = 1;
            document.getElementById('copperResult').classList.remove('show');
        }

        // ====== 动画循环 ======
        function animate() {
            try { drawWaterExp(); } catch (e) { console.error('实验一绘制出错:', e); }
            try { drawCopperExp(); } catch (e) { console.error('实验二绘制出错:', e); }
            requestAnimationFrame(animate);
        }

        // ====== 重置所有 ======
        function resetAll() {
            clearHeatingTimer();
            clearFreezingTimer();
            waterState = {
                tempType: 'none',
                waterLevel: 60,
                targetLevel: 60,
                startLevel: 60,
                changing: false,
                progress: 0,
                iceBlocks: [],
                hotBubbles: [],
                coldAir: [],
                snow: []
            };
            copperState = {
                tempState: 'normal',
                ballY: 0,
                ballVY: 0,
                ballVisible: true,
                ballPassed: false,
                ballStuck: false,
                ballR: BALL_R,
                tarBallR: BALL_R,
                rxOut: N_RX_OUT,
                ryOut: N_RY_OUT,
                rxIn: N_RX_IN,
                ryIn: N_RY_IN,
                tarRxOut: N_RX_OUT,
                tarRyOut: N_RY_OUT,
                tarRxIn: N_RX_IN,
                tarRyIn: N_RY_IN,
                shake: 0,
                shakeT: 0,
                fade: 1,
                freezeBgVisible: false,
                freezeTimer: 0,
                flames: [],
                snowflakes: [],
                wobble: 0,
                heatingTimeout: null,
                freezingTimeout: null
            };
            document.getElementById('waterResult').classList.remove('show');
            document.getElementById('copperResult').classList.remove('show');
        }

        animate();
    </script>

<script id="kaiming-copyright-script">
(function () {
  "use strict";

  /* 目标：单击标题 → 显示版权 3.5 秒；双击标题 → 打开 www.kaiwuaiscience.com */

  const HOMEPAGE = "https://www.kaiwuaiscience.com";
  const SHOW_MS = 3500;      // 版权显示时长
  const DBL_WINDOW = 280;    // 双击判定的时间窗（毫秒）
  const FADE_MS = 450;       // 淡出时长，与 CSS transition 一致

  function bindCopyright() {
    // 首选 #mainTitle（注入脚本会保证它存在）；后三个选择器是手写粘贴时的兜底
    const title = document.getElementById("mainTitle") ||
                  document.querySelector("h1, .title, .page-title, .main-title");
    const box = document.getElementById("kaiming-copyright");
    if (!title || !box) return;

    title.style.cursor = "pointer";
    title.style.userSelect = "none";
    title.style.webkitUserSelect = "none";

    let clickTimer = null;
    let hideTimer = null;
    let seq = 0;   // 每次显示/隐藏都 +1，用来作废在飞的定时器

    function showCopyright() {
      const my = ++seq;
      if (hideTimer) clearTimeout(hideTimer);
      box.style.display = "block";
      /* 强制重绘，让 0 → 1 的淡入真的发生。
         这里刻意不用 requestAnimationFrame：rAF 在页面不产生新帧时（后台标签页、
         无头渲染、大屏久置）不保证触发——一旦它晚于下方的隐藏定时器回调，
         就会把 opacity 又设成 1，导致版权条永久停在屏幕上。 */
      void box.offsetHeight;
      box.style.opacity = "1";
      hideTimer = setTimeout(function () {
        if (my !== seq) return;      // 期间又被点过，交给新的那一次收尾
        box.style.opacity = "0";
        setTimeout(function () {
          if (my === seq) box.style.display = "none";
        }, FADE_MS);
      }, SHOW_MS);
    }

    function hideCopyright() {
      const my = ++seq;              // 作废所有在飞的定时器，避免"淡出到一半又被点亮"卡住
      if (hideTimer) clearTimeout(hideTimer);
      if (box.style.display !== "block") return;
      box.style.opacity = "0";
      setTimeout(function () {
        if (my === seq) box.style.display = "none";
      }, FADE_MS);
    }

    function openHomepage() {
      // 双击时隐藏版权，并跳转官网
      hideCopyright();
      window.open(HOMEPAGE, "_blank", "noopener,noreferrer");
    }

    title.addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTimer) return;   // 已在等待双击窗口，忽略这次单击
      clickTimer = setTimeout(function () {
        clickTimer = null;
        showCopyright();        // 确认是单击
      }, DBL_WINDOW);
    });

    title.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      if (clickTimer) {         // 取消挂起的单击
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      openHomepage();
    });

    // 点击页面其它地方，立即隐藏版权
    document.addEventListener("click", function (e) {
      if (e.target === title) return;
      hideCopyright();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindCopyright);
  } else {
    bindCopyright();
  }
})();
</script>
