<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开物AI科学 · AI赋能科学教学</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<script src="data.js"></script>
<style>
:root{--ink:#182234;--mut:#5b6b83;--bg:#f5f7fb;--acc:#2f6bff;--accd:#e8efff;--line:#e5eaf2;--ok:#0e9f6e;--r:14px}
*{box-sizing:border-box;margin:0}
body{font:15px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
#nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navi{display:flex;align-items:center;gap:4px;height:60px;flex-wrap:nowrap;overflow-x:auto}
.logo{font-weight:800;font-size:19px;margin-right:12px;white-space:nowrap}
.nl{padding:7px 12px;border-radius:9px;color:var(--mut);font-weight:600;white-space:nowrap}
.nl:hover{background:#eef2fb;color:var(--ink)}
.nl.on{background:var(--accd);color:var(--acc)}
.sp{flex:1}
.hero{background:linear-gradient(135deg,#101a33,#2b1e5c 60%,#4a2b7a);color:#fff;padding:64px 0 56px;text-align:center}
.hero h1{font-size:clamp(26px,4.5vw,42px);line-height:1.3;font-weight:800}
.hero p{margin:16px auto 26px;color:#c9d4f5;max-width:640px}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn.big{padding:13px 28px;font-size:16px}
.btn:disabled{background:#b9c4d8;cursor:not-allowed}
h2.sec{font-size:22px;margin:44px 0 6px}
p.sub{color:var(--mut);margin-bottom:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(24,34,52,.09)}
.card h3{font-size:16.5px}
.badge{display:inline-block;font-size:12px;background:#eef2fb;color:var(--acc);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0;font-weight:600}
.badge.g3{background:#e6f7f1;color:#0b8a62}.badge.ar{background:#f3e8ff;color:#7c3aed}
.desc{color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.live{color:var(--ok);font-weight:700}
.fgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.15s;display:block}
.fcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(24,34,52,.14)}
.fimg{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1b2a55,#5b3a9e);display:flex;align-items:center;justify-content:center;font-size:44px}
.fimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 10px;border-radius:7px;z-index:2}
.fbody{padding:13px 16px}.fbody b{font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
select,input{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 18px}
.detail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px;margin:26px auto}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:18px 0;font-size:14.5px}
.dl dt{color:var(--mut);font-weight:600}.dl dd{border-bottom:1px dashed var(--line)}
.pbox{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0;max-height:520px;overflow:auto}
.pbox pre{white-space:pre-wrap;word-break:break-word;font:14px/1.9 ui-monospace,Consolas,"PingFang SC",monospace}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.note{background:#fffbe8;border:1px solid #f5e6a8;border-radius:10px;padding:10px 14px;color:#8a6d1a;font-size:13.5px;margin-top:14px}
.ai{color:var(--mut);font-size:12.5px;border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
#ft{margin-top:64px;border-top:1px solid var(--line);background:#fff;padding:26px 0;text-align:center;color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:99}
#toast.show{opacity:1}
.mbg{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:28px;max-width:380px;width:100%}
.mbox h3{margin-bottom:8px}.mbox input{width:100%;margin:14px 0;font-size:18px;text-align:center;letter-spacing:4px}
.mrow{display:flex;gap:10px;justify-content:flex-end}
.err{color:#d33;font-size:13px;min-height:18px}
.mini{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<header id="nav"><div class="wrap navi"></div></header>
<main id="app"></main>
<footer id="ft"><div class="wrap">© 2026 开物AI科学 · AI赋能 · 教育公平<br>内容由AI辅助生成，仅供教学交流 · <a href="#/about" style="color:var(--acc)">关于本站</a> · <a href="#/admin" style="color:var(--mut)">管理</a></div></footer>
<div id="toast"></div><div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const code=(off=0)=>10000+fnv(ymd(new Date(Date.now()-off*864e5))+"|"+CONFIG.SECRET)%90000;
const isTodo=v=>!v||String(v).indexOf("TODO")>-1;
const ALL=()=>[...WEB_ITEMS,...TOOLS];
const byId=id=>ALL().find(x=>x.id===id);
const R={}; // ← 路由表（关键修复：必须在使用前声明）

let ST=JSON.parse(localStorage.getItem("kw_st")||"{}");
const bump=(id,k)=>{(ST[id]=ST[id]||{v:0,d:0})[k]++;localStorage.setItem("kw_st",JSON.stringify(ST))};
const cnt=(id,k)=>(ST[id]||{})[k]||0;

function toast(m){const t=$("#toast");t.textContent=m;t.className="show";setTimeout(()=>t.className="",1600)}
function copyTxt(s,tip){const done=()=>toast(tip||"已复制 ✓");
 if(navigator.clipboard){navigator.clipboard.writeText(s).then(done).catch(()=>fb())}else fb();
 function fb(){const t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()}}

function unlocked(){return localStorage.getItem("kw_day")===ymd()}
function gate(url){if(!url||isTodo(url))return toast("该资源整理中，敬请期待 🙌");
 if(unlocked()){window.open(url,"_blank");return}
 $("#modal").innerHTML=`<div class="mbg" onclick="closeM()"><div class="mbox" onclick="event.stopPropagation()">
 <h3>🔓 请输入今日下载码</h3><p class="mini">下载码每日更新，获取方式见「关于本站」。</p>
 <input id="cdin" placeholder="5位数字码" inputmode="numeric">
 <div class="mrow"><button class="btn ghost" onclick="closeM()">取消</button><button class="btn" onclick="tryCd('${url}')">确认下载</button></div>
 <p id="cderr" class="err"></p></div></div>`;$("#cdin").focus()}
function tryCd(u){const v=$("#cdin").value.trim();
 if(v===String(code())||v===String(code(1))){localStorage.setItem("kw_day",ymd());closeM();bump("site","d");window.open(u,"_blank")}
 else $("#cderr").textContent="下载码不对，看看数字有没有敲错～"}
function closeM(){$("#modal").innerHTML=""}

const GRADES=["三年级","三年级上","三年级下","四年级上","五年级上","六年级上","八年级","全年级","通用"];
const uniq=a=>[...new Set(a.filter(x=>x&&!isTodo(x)))];
const gsort=a=>a.sort((x,y)=>(GRADES.indexOf(x)+99)%(999)-(GRADES.indexOf(y)+99)%(999));
const badges=it=>{let s="";if(it.g)s+=`<span class="badge ${it.g.includes("三年级")?"g3":""}">${esc(it.g)}</span>`;
 if(it.ty)s+=`<span class="badge ${/AR/.test(it.ty)?"ar":""}">${esc(it.ty)}</span>`;
 if(it.u&&!isTodo(it.u))s+=`<span class="badge">${esc(it.u)}</span>`;return s};

function cardHTML(it,sec){return `<a class="card" href="#/${sec}/${it.id}"><h3>${esc(it.t)}</h3>
 <div>${badges(it)}</div><p class="desc">${esc(it.d)}</p>
 <div class="foot">${it.lv?'<span class="live">● 可在线体验</span>':isTodo(it.lk)?'<span>整理中…</span>':""}
 ${cnt(it.id,"v")?`<span>👁 ${cnt(it.id,"v")}</span>`:""}<span style="margin-left:auto">详情 →</span></div></a>`}

/* ---- 列表页（筛选） ---- */
const FL={web:{g:"",ty:"",c:"",u:"",q:""},tools:{g:"",ty:"",q:""}};
function drawList(sec){const st=FL[sec];
 const arr=(sec==="web"?WEB_ITEMS:TOOLS).filter(it=>
  (!st.g||it.g===st.g)&&(!st.ty||it.ty===st.ty)&&(!st.c||it.c===st.c)&&(!st.u||it.u===st.u)&&
  (!st.q||(it.t+it.d+(it.u||"")+(it.c||"")).indexOf(st.q)>-1));
 $("#list").innerHTML=`<p class="mini" style="margin:6px 0 14px">共 ${arr.length} 个资源</p><div class="grid">${arr.map(it=>cardHTML(it,sec)).join("")||"<p>没有符合条件的资源</p>"}</div>`}
function listPage(sec){const st=FL[sec];const src=sec==="web"?WEB_ITEMS:TOOLS;
 const chips=(key)=>uniq(src.map(x=>x[key])).length>1?`<div class="chips">${gsort(uniq(src.map(x=>x[key]))).map(v=>
  `<button class="chip ${st[key]===v?"on":""}" onclick="FL.${sec}.${key}=FL.${sec}.${key}==='${v}'?'':'${v}';drawList('${sec}')">${esc(v)}</button>`).join("")}</div>`:"";
 $("#app").innerHTML=`<div class="wrap"><h2 class="sec">${sec==="web"?"🧪 教学网页":"🎮 课堂工具"}</h2>
 <p class="sub">${sec==="web"?"覆盖小学科学各单元的互动实验与3D/AR网页":"让课堂管理更省力的积分、点名与计时工具"}</p>
 ${chips("g")}${sec==="web"?chips("ty")+chips("c")+chips("u"):chips("ty")}
 <div class="bar"><input id="q" placeholder="🔍 搜索名称 / 简介 / 概念…" style="flex:1;min-width:200px" value="${esc(st.q)}"
  oninput="FL.${sec}.q=this.value.trim();drawList('${sec}')"></div>
 <div id="list"></div></div>`;drawList(sec)}

/* ---- 详情页 ---- */
function detail(id){const it=byId(id);if(!it)return R.home();bump(it.id,"v");
 const sec=WEB_ITEMS.includes(it)?"web":"tools";
 const meta=[["年级",it.g],["教材单元",it.u],["课时",it.ls],["科学领域",it.f],["核心概念",it.c],["类型",it.ty]].filter(x=>x[1]);
 $("#app").innerHTML=`<div class="wrap"><div class="detail">
 <a href="#/${sec}" class="mini">← 返回列表</a>
 <h2 class="sec" style="margin-top:8px">${esc(it.t)}</h2><div style="margin:8px 0">${badges(it)}</div>
 <dl class="dl">${meta.map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>
 <p style="color:var(--mut)">${esc(it.d)}</p>
 <div class="row">
  ${it.lv?`<a class="btn big" href="${it.lv}" target="_blank">🚀 在线体验</a>`:""}
  <button class="btn big ${it.lv?"ghost":""}" ${isTodo(it.lk)?"disabled":""} onclick="gate('${it.lk||""}')">⬇ 下载资源（zip）</button>
  ${it.pp?`<a class="btn ghost" href="#/p/${it.pp}">📄 本网页由AI生成 · 查看提示词</a>`:""}
 </div>
 <p class="mini" style="margin-top:14px">浏览 ${cnt(it.id,"v")} · 下载 ${cnt(it.id,"d")}</p>
 <p class="ai">※ 本内容由 AI 辅助生成，经教师实测审核，仅供教学交流使用。</p>
 </div></div>`}

/* ---- 提示词 ---- */
function promptsPage(){$("#app").innerHTML=`<div class="wrap"><h2 class="sec">📄 提示词库</h2>
 <p class="sub">复制给 DeepSeek 等AI，你也能生成同款课堂互动网页</p>
 <div class="grid">${PROMPTS.map(p=>`<a class="card" href="#/p/${p.id}"><h3>${esc(p.t)}</h3>
  ${p.plat?`<div><span class="badge">适用：${esc(p.plat)}</span></div>`:""}
  <p class="desc">${isTodo(p.txt)?"提示词全文整理中…":esc(p.txt.slice(0,60))+"…"}</p>
  <div class="foot">${p.pr?'<span class="live">● 有同款成品</span>':""}<span style="margin-left:auto">查看全文 →</span></div></a>`).join("")}</div></div>`}
function promptDetail(id){const p=PROMPTS.find(x=>x.id===id);if(!p)return R.home();
 const prod=p.pr?byId(p.pr):null;
 $("#app").innerHTML=`<div class="wrap"><div class="detail">
 <a href="#/prompts" class="mini">← 返回提示词库</a>
 <h2 class="sec" style="margin-top:8px">📄 ${esc(p.t)}</h2>
 ${p.plat?`<div style="margin:8px 0"><span class="badge">适用平台：${esc(p.plat)}</span></div>`:""}
 ${isTodo(p.txt)?`<p class="note">提示词全文整理中，即将上传。</p>`:
 `<div class="pbox"><pre>${esc(p.txt)}</pre></div>
 <div class="row"><button class="btn big" onclick="copyTxt(PROMPTS.find(x=>x.id==='${p.id}').txt,'提示词已复制，去粘贴给AI吧 ✓')">📋 一键复制全文</button>
 ${prod?`<a class="btn ghost" href="#/${WEB_ITEMS.includes(prod)?"web":"tools"}/${prod.id}">查看同款成品「${esc(prod.t)}」→</a>`:""}</div>`}
 <p class="ai">※ 本提示词由 AI 辅助整理，欢迎教师复用与改编。</p></div></div>`}

/* ---- 教学设计 ---- */
function designPage(){$("#app").innerHTML=`<div class="wrap"><h2 class="sec">📚 教学设计</h2>
 <p class="sub">配套单元教学设计文档（docx），含提取码</p><div class="grid">
 ${DESIGNS.map(d=>`<div class="card"><h3>${esc(d.t)}</h3>
  ${d.g&&!isTodo(d.g)?`<div><span class="badge g3">${esc(d.g)}</span></div>`:""}
  <p class="desc">${isTodo(d.d)?"简介待补充":esc(d.d)}</p>
  <div class="foot"><span class="badge">提取码：${isTodo(d.cd)?"待补":esc(d.cd)}</span></div>
  <div class="row">${isTodo(d.lk)?"":`<button class="btn ghost" onclick="copyTxt('${d.lk}'+' 提取码：${d.cd}','链接和提取码已复制 ✓')">📋 复制链接+提取码</button>
  <button class="btn" onclick="gate('${d.lk}')">⬇ 下载</button>`}</div></div>`).join("")}</div></div>`}

/* ---- 首页 ---- */
R.home=function(){
 const F=[["w10","教学网页 · 精选"],["w17","教学网页 · 精选"],["t15","课堂工具 · 精选"],["t08","课堂工具 · 精选"]];
 const P=[["p01","t02"],["p02","w05"],["p03","w06"]];
 $("#app").innerHTML=`
 <section class="hero"><div class="wrap">
  <h1>把 AI 生成的互动实验<br>带进每一节科学课</h1>
  <p>免费开放的科学教学资源库：${WEB_ITEMS.length} 个教学网页 · ${TOOLS.length} 个课堂工具 · ${PROMPTS.length} 套提示词 · ${DESIGNS.length} 份教学设计</p>
  <a class="btn big" href="#/web">浏览教学网页</a>
  <a class="btn ghost big" style="background:transparent;color:#fff;border-color:#ffffff66" href="#/prompts" onmouseover="this.style.borderColor='#fff'" onmouseout="this.style.borderColor='#ffffff66'">提示词库</a>
 </div></section>
 <div class="wrap">
  <h2 class="sec">✨ 常驻精选 · 点击照片直接在线体验</h2><p class="sub">无需下载，打开即用，支持投屏</p>
  <div class="fgrid">${F.map(([id,tag])=>{const it=byId(id);return `
   <a class="fcard" href="${it.lv}" target="_blank"><div class="fimg">🧪<img src="${it.sh}" onerror="this.remove()"><span class="ftag">${tag}</span></div>
   <div class="fbody"><b>${esc(it.t)}</b><p class="desc" style="margin-top:4px">${esc(it.d)}</p></div></a>`}).join("")}</div>
  <h2 class="sec">🔗 提示词 → 成品，一站式看懂</h2><p class="sub">每条提示词都有用它生成的真实网页，点击直达</p>
  <div class="grid">${P.map(([pid,wid])=>{const p=PROMPTS.find(x=>x.id===pid),it=byId(wid);return `
   <a class="card" href="${it.lv}" target="_blank"><h3>📄 ${esc(p.t)}</h3><p class="desc">生成的成品：${esc(it.t)} · 点击在线体验</p>
   <div class="foot"><span class="live">● 即点即玩</span><span style="margin-left:auto"><a href="#/p/${p.id}" onclick="event.stopPropagation()">看提示词 →</a></span></div></a>`}).join("")}</div>
  <div class="grid" style="margin-top:40px">
   <a class="card" href="#/web"><h3>🧪 教学网页 <span class="badge">${WEB_ITEMS.length}</span></h3><p class="desc">互动实验、3D模型、AR场景，按年级/单元/核心概念筛选</p></a>
   <a class="card" href="#/tools"><h3>🎮 课堂工具 <span class="badge">${TOOLS.length}</span></h3><p class="desc">小组积分、随机点名、计时专注，课堂管理全配套</p></a>
   <a class="card" href="#/prompts"><h3>📄 提示词库 <span class="badge">${PROMPTS.length}</span></h3><p class="desc">复制即用的AI提示词，生成你自己的互动网页</p></a>
   <a class="card" href="#/design"><h3>📚 教学设计 <span class="badge">${DESIGNS.length}</span></h3><p class="desc">配套单元教学设计文档下载</p></a>
  </div>
 </div>`};

/* ---- 关于 / 管理 ---- */
R.about=function(){$("#app").innerHTML=`<div class="wrap"><div class="detail" style="max-width:640px">
 <h2 class="sec" style="margin-top:0">关于本站</h2>
 ${ABOUT.split("\n").map(x=>`<p style="margin:10px 0">${esc(x)}</p>`).join("")}
 ${CONFIG.QR?`<img src="${CONFIG.QR}" style="width:180px;margin:18px auto" onerror="this.remove()" alt="二维码">`:""}
 <div class="note">🔑 <b>每日下载码</b>：资源下载需输入当日5位下载码，码每天更换。扫码/进教研群免费获取。</div>
 <p class="ai">站长：vpilgrim · 本站基于 Cloudflare Pages 构建，内容含 AI 辅助生成部分</p></div></div>`};

R.admin=function(){
 if(sessionStorage.getItem("kw_ad")!=="1"){$("#app").innerHTML=`<div class="wrap"><div class="detail" style="max-width:380px">
  <h2 class="sec" style="margin-top:0">🔐 管理后台</h2>
  <input id="au" placeholder="用户名" style="width:100%;margin-bottom:10px"><input id="ap" type="password" placeholder="密码" style="width:100%">
  <div class="row"><button class="btn" style="width:100%" onclick="aLogin()">登录</button></div><p id="aerr" class="err"></p></div></div>`;return}
 const todo=[];
 WEB_ITEMS.forEach(x=>{if(isTodo(x.lk))todo.push(`教学网页「${x.t}」缺下载链接`)});
 PROMPTS.forEach(x=>{if(isTodo(x.t))todo.push(`提示词缺名称（${x.id}）`);if(isTodo(x.txt))todo.push(`提示词「${x.t}」缺全文`)});
 DESIGNS.forEach(x=>{if(isTodo(x.t)||isTodo(x.lk)||isTodo(x.cd))todo.push(`教学设计（${x.id}）信息不全`)});
 $("#app").innerHTML=`<div class="wrap"><div class="detail">
 <h2 class="sec" style="margin-top:0">🛠 管理后台</h2>
 <div class="note" style="font-size:15px">今天的下载码：<b style="font-size:24px;letter-spacing:3px">${code()}</b>
 <button class="btn ghost" style="padding:4px 12px;margin-left:10px" onclick="copyTxt(String(code()),'下载码已复制 ✓')">复制</button><br><span class="mini">每天0点自动更换 · 含昨日码兜底</span></div>
 <h2 class="sec">📋 待补录清单（${todo.length}）</h2>
 ${todo.length?`<ul style="margin:8px 0 8px 18px;color:var(--mut);font-size:14px">${todo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="mini">在 GitHub 的 data.js 中搜索 TODO 逐个填上即可。</p>`:`<p style="color:var(--ok)">✅ 全部数据就绪！</p>`}
 <h2 class="sec">📊 资源数据（本浏览器统计）</h2>
 <dl class="dl">${ALL().filter(x=>cnt(x.id,"v")).map(x=>`<dt>${esc(x.t)}</dt><dd>👁 ${cnt(x.id,"v")} · ⬇ ${cnt(x.id,"d")}</dd>`).join("")||"<dt>—</dt><dd>暂无浏览记录</dd>"}</dl>
 <div class="row"><button class="btn ghost" onclick="sessionStorage.removeItem('kw_ad');R.admin()">退出登录</button></div>
 </div></div>`};
function aLogin(){if($("#au").value===CONFIG.ADMIN_USER&&$("#ap").value===CONFIG.ADMIN_PASS){sessionStorage.setItem("kw_ad","1");R.admin()}else $("#aerr").textContent="用户名或密码不对"}

/* ---- 路由 ---- */
R.web=()=>listPage("web");R.tools=()=>listPage("tools");
R.prompts=promptsPage;R.design=designPage;
function route(){const h=(location.hash||"#/home").split("/");const p=h[1]||"home";
 const links=[["home","首页"],["prompts","提示词库"],["web","教学网页"],["tools","课堂工具"],["design","教学设计"],["about","关于"]];
 $(".navi").innerHTML=`<a class="logo" href="#/home">🪐 开物AI科学</a>`+links.map(l=>
  `<a class="nl ${p===l[0]?"on":""}" href="#/${l[0]}">${l[1]}</a>`).join("")+`<span class="sp"></span><a class="nl" href="#/admin">⚙️</a>`;
 window.scrollTo(0,0);
 if((p==="web"||p==="tools")&&h[2])return detail(h[2]);
 if(p==="p"&&h[2])return promptDetail(h[2]);
 const fn=R[p]||R.home;fn()}
window.onhashchange=route;route();
</script>
